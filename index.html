<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灰燼の書庫 -Ashbound Codex-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #14110F;
    --bg-panel: #1D1812;
    --bg-panel-raised: #262019;
    --line: #3A3025;
    --parchment: #EDE3D0;
    --parchment-dim: #C9BC9F;
    --ink: #211C16;
    --ink-soft: #4a4030;
    --ember: #C1502E;
    --ember-dim: #7a3620;
    --steel: #4C7A8C;
    --steel-dim: #33525e;
    --violet: #7A5FA0;
    --violet-dim: #4f3d6a;
    --gold: #D4A73E;
    --hp-red: #A63A3A;
    --poison-green: #6C8A3E;
    --font-display: 'Shippori Mincho', serif;
    --font-en: 'Cormorant Garamond', serif;
    --font-ui: 'Zen Kaku Gothic New', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #2a2015 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #1a1410 0%, transparent 55%),
      var(--bg-void);
    color:var(--parchment);
    font-family:var(--font-ui);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:16px;
  }
  #app{ width:100%; max-width:960px; }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0;}
  .eyebrow{ font-family:var(--font-en); letter-spacing:.04em; color:var(--parchment-dim); font-size:13px; margin:0 0 4px;}
  button{
    font-family:var(--font-ui);
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-panel-raised);
    color:var(--parchment);
    border-radius:3px;
    padding:10px 18px;
    font-size:14px;
    transition:all .12s ease;
  }
  button:hover:not(:disabled){ border-color:var(--gold); color:var(--gold); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.primary{ background:linear-gradient(180deg,#c1502e,#93381e); border-color:#7a3620; color:#f5e9d8; font-weight:600;}
  button.primary:hover:not(:disabled){ color:#fff; border-color:var(--gold); }
  button.ghost{ background:transparent; }
  input[type=text],input[type=number],select,textarea{
    background:var(--bg-void); border:1px solid var(--line); color:var(--parchment);
    padding:8px 10px; border-radius:3px; font-family:var(--font-ui); font-size:14px; width:100%;
  }
  label{ font-size:12.5px; color:var(--parchment-dim); display:block; margin-bottom:4px;}
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:12px; }
  .row > .field{ flex:1; }
  .hidden{ display:none !important; }
  .screen{ animation:fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Home ---------- */
  .home-hero{ text-align:center; padding:60px 20px 40px; }
  .home-hero .eyebrow{ text-align:center; }
  .home-hero h1{ font-size:44px; color:var(--parchment); }
  .home-hero .sub{ font-family:var(--font-en); font-style:italic; color:var(--parchment-dim); font-size:18px; margin-top:6px;}
  .home-actions{ display:flex; flex-direction:column; gap:10px; max-width:280px; margin:36px auto 0; }
  .home-actions button{ padding:14px; font-size:15px; }
  .home-foot{ text-align:center; color:var(--ink-soft); font-size:12px; margin-top:30px;}

  /* ---------- Top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .topbar h2{ font-size:20px; }
  .topbar .eyebrow{ margin:0; }

  /* ---------- Card visual ---------- */
  .card{
    width:150px; min-width:150px; height:210px; border-radius:8px;
    background:linear-gradient(180deg,#f2e9d8,var(--parchment));
    color:var(--ink); position:relative; display:flex; flex-direction:column;
    border:2px solid #8a7752; box-shadow:0 4px 10px rgba(0,0,0,.4);
    overflow:hidden; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    flex-shrink:0;
  }
  .card:hover{ transform:translateY(-10px); box-shadow:0 12px 20px rgba(0,0,0,.5); }
  .card.unplayable{ filter:grayscale(.6) brightness(.7); cursor:default; }
  .card.unplayable:hover{ transform:none; }
  .card .banner{ height:34px; display:flex; align-items:center; padding:0 10px; }
  .card.type-attack .banner{ background:linear-gradient(90deg,var(--ember),var(--ember-dim)); }
  .card.type-skill .banner{ background:linear-gradient(90deg,var(--steel),var(--steel-dim)); }
  .card.type-power .banner{ background:linear-gradient(90deg,var(--violet),var(--violet-dim)); }
  .card .cost{
    position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%;
    background:var(--ink); color:var(--gold); font-family:var(--font-en); font-weight:700;
    display:flex; align-items:center; justify-content:center; font-size:14px; border:2px solid var(--gold); z-index:2;
  }
  .card .name{ color:#fff; font-family:var(--font-display); font-size:12.5px; font-weight:700; padding-left:24px; line-height:1.2; }
  .card .art{ flex:1; background:repeating-linear-gradient(135deg,#dfd2b6,#dfd2b6 8px,#d4c5a4 8px,#d4c5a4 16px); position:relative;}
  .card.type-attack .art{ background:repeating-linear-gradient(135deg,#e7cdb8,#e7cdb8 8px,#dcb99a 8px,#dcb99a 16px);}
  .card.type-skill .art{ background:repeating-linear-gradient(135deg,#cfe0e3,#cfe0e3 8px,#c0d4d8 8px,#c0d4d8 16px);}
  .card.type-power .art{ background:repeating-linear-gradient(135deg,#ded3ea,#ded3ea 8px,#d0c0e0 8px,#d0c0e0 16px);}
  .card .desc{ font-size:11px; line-height:1.35; padding:7px 8px; background:var(--parchment); min-height:56px;}
  .card .rarity-dot{ position:absolute; bottom:5px; right:7px; font-size:9px; letter-spacing:.03em; color:var(--ink-soft); font-family:var(--font-en); }

  /* small card for editor list */
  .card.mini{ width:120px; height:168px; }
  .card.mini .name{ font-size:11px; }
  .card.mini .desc{ font-size:9.5px; min-height:44px; }

  /* ---------- Battle screen ---------- */
  .battlefield{ display:flex; justify-content:space-between; align-items:flex-start; padding:10px 6px 20px; gap:10px;}
  .combatant{ text-align:center; width:150px; }
  .combatant .portrait{
    width:110px; height:110px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
    font-size:44px; border:2px solid var(--line); background:radial-gradient(circle at 35% 30%, #362b1c, #14110f);
  }
  .combatant.enemy .portrait{ border-color:var(--ember-dim); }
  .combatant.player .portrait{ border-color:var(--steel-dim); }
  .combatant .cname{ font-family:var(--font-display); font-size:15px; margin-bottom:4px;}
  .hpbar-wrap{ background:#000; border:1px solid var(--line); border-radius:10px; height:16px; overflow:hidden; position:relative; }
  .hpbar-fill{ height:100%; background:linear-gradient(90deg,#7a2020,var(--hp-red)); transition:width .3s ease; }
  .hpbar-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-family:var(--font-en); font-weight:700; text-shadow:0 1px 2px #000;}
  .statuses{ display:flex; gap:5px; justify-content:center; margin-top:6px; flex-wrap:wrap;}
  .status-chip{ font-size:10.5px; background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:10px; padding:2px 7px;}
  .intent{ margin-top:8px; font-size:12px; color:var(--parchment-dim); background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:5px; padding:5px 8px; min-height:16px;}
  .intent.atk{ color:#e39a7f;}
  .intent.def{ color:#9fc3ce;}
  .intent.buf{ color:#c4a8de;}

  .vsmark{ font-family:var(--font-en); font-size:26px; color:var(--line); margin-top:36px; }

  .hand-zone{ background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:16px 10px; margin-top:8px;}
  .hand-row{ display:flex; gap:10px; overflow-x:auto; padding:6px 4px 14px; justify-content:center; flex-wrap:wrap; }
  .battle-controls{ display:flex; align-items:center; justify-content:space-between; padding:0 6px;}
  .pile-info{ display:flex; gap:14px; font-size:12.5px; color:var(--parchment-dim); }
  .energy-badge{
    display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f0d488, var(--gold)); color:#3a2a06; font-family:var(--font-en); font-weight:700; font-size:18px; border:2px solid #8a6a1e;
  }
  .floor-progress{ font-size:12px; color:var(--parchment-dim); text-align:center; margin-bottom:6px;}

  .log-box{ font-size:12px; color:var(--parchment-dim); background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; max-height:70px; overflow-y:auto; margin-top:10px;}
  .log-box div{ margin-bottom:2px; }

  /* ---------- Reward / result screens ---------- */
  .center-screen{ text-align:center; padding:30px 10px; }
  .reward-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:24px 0; }

  /* ---------- Editor list ---------- */
  .editor-grid{ display:flex; gap:14px; flex-wrap:wrap; }
  .editor-card-wrap{ position:relative; }
  .editor-card-wrap .edit-actions{ display:flex; gap:4px; margin-top:6px; justify-content:center;}
  .editor-card-wrap .edit-actions button{ padding:4px 8px; font-size:11px; }
  .add-card-tile{
    width:120px; height:168px; border:2px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--parchment-dim); font-size:32px; cursor:pointer;
  }
  .add-card-tile:hover{ border-color:var(--gold); color:var(--gold); }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(10,8,6,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal-box{ background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:22px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;}
  .modal-box h3{ margin-bottom:16px; font-size:18px;}
  .checkbox-field{ display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .checkbox-field input{ width:auto; }
  .checkbox-field label{ margin:0; color:var(--parchment); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .section-label{ font-family:var(--font-en); font-style:italic; color:var(--gold); font-size:13px; margin:16px 0 8px; border-top:1px solid var(--line); padding-top:12px;}

  /* ---------- Settings ---------- */
  .settings-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:20px; max-width:520px; margin:0 auto;}
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>

function normalizeCard(c){const d=DEFAULT_CARDS.find(x=>x.id===c.id)||DEFAULT_CARDS[0];const o={...d,...c};
['tempStrengthTurns','tempMetallicizeTurns','weakTurns','vulnerableTurns','poisonTurns','burn','burnTurns','bleed','bleedTurns','permanentStrength','permanentMetallicize'].forEach(k=>{if(o[k]==null)o[k]=0});
if(o.target==null)o.target='enemy';if(o.tags==null)o.tags='';if(o.upgrade==null)o.upgrade={damage:0,block:0,cost:0};return o}
function normalizeCards(cards){return (Array.isArray(cards)&&cards.length?cards:DEFAULT_CARDS).map(normalizeCard)}
function loadJSON(key,fallback){try{const v=localStorage.getItem(key)||localStorage.getItem(key.replace('_v3',''))||localStorage.getItem(key==='ashbound_codex_cards_v3'?'cards':'settings');return v?JSON.parse(v):fallback}catch(e){return fallback}}
function saveJSON(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}}
async function loadCards(){return normalizeCards(loadJSON(STORAGE_KEYS.cards,DEFAULT_CARDS))}
async function saveCards(cards){saveJSON(STORAGE_KEYS.cards,cards)}

function effective(c){const lv=cardLevel(c),u=c.upgrade||{};return {...c,cost:Math.max(0,c.cost+(u.cost||0)*lv),damage:(c.damage||0)+(u.damage||0)*lv,block:(c.block||0)+(u.block||0)*lv}}
function cardDescription(c){c=effective(c);const p=[];
if(c.damage)p.push(`敵に${c.damage}ダメージ`);if(c.block)p.push(`ブロック${c.block}`);if(c.draw)p.push(`1枚引く×${c.draw}`);if(c.energy)p.push(`エネルギー+${c.energy}`);
if(c.strength)p.push(`戦闘中の筋力+${c.strength}${c.tempStrengthTurns?`（${c.tempStrengthTurns}T）`:''}`);if(c.permanentStrength)p.push(`永続筋力+${c.permanentStrength}`);
if(c.metallicize)p.push(`戦闘中の自動ガード+${c.metallicize}${c.tempMetallicizeTurns?`（${c.tempMetallicizeTurns}T）`:''}`);if(c.permanentMetallicize)p.push(`永続自動ガード+${c.permanentMetallicize}`);
if(c.weak)p.push(`弱体${c.weak}${c.weakTurns?`（${c.weakTurns}T）`:''}`);if(c.vulnerable)p.push(`脆弱${c.vulnerable}${c.vulnerableTurns?`（${c.vulnerableTurns}T）`:''}`);if(c.poison)p.push(`毒${c.poison}${c.poisonTurns?`（${c.poisonTurns}T）`:''}`);if(c.burn)p.push(`燃焼${c.burn}${c.burnTurns?`（${c.burnTurns}T）`:''}`);if(c.bleed)p.push(`出血${c.bleed}${c.bleedTurns?`（${c.bleedTurns}T）`:''}`);if(c.heal)p.push(`HP+${c.heal}`);if(c.loseHp)p.push(`自分に${c.loseHp}ダメージ`);if(c.exhaust)p.push('使用後消滅');if(c.tags)p.push(`［${c.tags}］`);return p.length?p.join('。')+'。':'効果なし'}

function openCardModal(card,isNew){const c=normalizeCard(card);const overlay=el(`<div class="modal-overlay"><div class="modal-box"><h3>${isNew?'カードを新規作成':'カードを編集'}</h3><div class="field"><label>カード名</label><input id="m-name" value="${c.name}"></div><div class="row"><div class="field"><label>タイプ</label><select id="m-type"><option value="attack">アタック</option><option value="skill">スキル</option><option value="power">パワー</option></select></div><div class="field"><label>コスト（0～6）</label><input id="m-cost" type="number" value="${c.cost}" min="0" max="6"></div></div><div class="row"><div class="field"><label>レアリティ</label><select id="m-rarity"><option value="basic">ベーシック</option><option value="common">コモン</option><option value="uncommon">アンコモン</option><option value="rare">レア</option></select></div><div class="field"><label>開始デッキ枚数</label><input id="m-start" type="number" value="${c.startingCount||0}" min="0" max="20"></div></div><div class="section-label">基本効果</div><div class="row"><div class="field"><label>ダメージ</label><input id="m-dmg" type="number" value="${c.damage||0}" min="0" max="999"></div><div class="field"><label>ブロック</label><input id="m-block" type="number" value="${c.block||0}" min="0" max="999"></div></div><div class="row"><div class="field"><label>ドロー</label><input id="m-draw" type="number" value="${c.draw||0}" min="0" max="20"></div><div class="field"><label>エネルギー</label><input id="m-energy" type="number" value="${c.energy||0}" min="0" max="20"></div></div><div class="section-label">一時効果（ターン数は0～99）</div><div class="row"><div class="field"><label>戦闘中の筋力</label><input id="m-str" type="number" value="${c.strength||0}" min="0" max="99"></div><div class="field"><label>持続ターン</label><input id="m-strt" type="number" value="${c.tempStrengthTurns||0}" min="0" max="99"></div></div><div class="row"><div class="field"><label>戦闘中の自動ガード</label><input id="m-met" type="number" value="${c.metallicize||0}" min="0" max="99"></div><div class="field"><label>持続ターン</label><input id="m-mett" type="number" value="${c.tempMetallicizeTurns||0}" min="0" max="99"></div></div><div class="section-label">永続効果</div><div class="row"><div class="field"><label>永続筋力</label><input id="m-pstr" type="number" value="${c.permanentStrength||0}" min="0" max="99"></div><div class="field"><label>永続自動ガード</label><input id="m-pmet" type="number" value="${c.permanentMetallicize||0}" min="0" max="99"></div></div><div class="section-label">状態異常</div><div class="row"><div class="field"><label>弱体量 / ターン</label><input id="m-weak" type="number" value="${c.weak||0}" min="0" max="99"><input id="m-weakt" type="number" value="${c.weakTurns||0}" min="0" max="99"></div><div class="field"><label>脆弱量 / ターン</label><input id="m-vuln" type="number" value="${c.vulnerable||0}" min="0" max="99"><input id="m-vulnt" type="number" value="${c.vulnerableTurns||0}" min="0" max="99"></div></div><div class="row"><div class="field"><label>毒量 / ターン</label><input id="m-poison" type="number" value="${c.poison||0}" min="0" max="99"><input id="m-poisont" type="number" value="${c.poisonTurns||0}" min="0" max="99"></div><div class="field"><label>燃焼量 / ターン</label><input id="m-burn" type="number" value="${c.burn||0}" min="0" max="99"><input id="m-burnt" type="number" value="${c.burnTurns||0}" min="0" max="99"></div></div><div class="row"><div class="field"><label>出血量 / ターン</label><input id="m-bleed" type="number" value="${c.bleed||0}" min="0" max="99"><input id="m-bleedt" type="number" value="${c.bleedTurns||0}" min="0" max="99"></div><div class="field"><label>回復 / 自傷</label><input id="m-heal" type="number" value="${c.heal||0}" min="0" max="999"><input id="m-lose" type="number" value="${c.loseHp||0}" min="0" max="999"></div></div><div class="section-label">追加設定</div><div class="row"><div class="field"><label>対象</label><select id="m-target"><option value="enemy">敵1体</option><option value="all">敵全体</option><option value="self">自分</option></select></div><div class="field"><label>タグ</label><input id="m-tags" value="${c.tags||''}" placeholder="攻撃,防御,パワー"></div></div><div class="row"><div class="field"><label>アップグレード時ダメージ増加</label><input id="m-ud" type="number" value="${c.upgrade?.damage||0}" min="0" max="99"></div><div class="field"><label>アップグレード時ブロック増加</label><input id="m-ub" type="number" value="${c.upgrade?.block||0}" min="0" max="99"></div></div><div class="checkbox-field"><input id="m-exhaust" type="checkbox" ${c.exhaust?'checked':''}><label for="m-exhaust">使用後に消滅</label></div><div class="modal-actions"><button class="ghost" id="cancel">キャンセル</button><button class="primary" id="save">保存</button></div></div></div>`);document.body.appendChild(overlay);qs('#m-type').value=c.type;qs('#m-rarity').value=c.rarity;qs('#m-target').value=c.target;qs('#cancel').onclick=()=>overlay.remove();qs('#save').onclick=async()=>{const u={...c,id:c.id,name:qs('#m-name').value.trim()||'無名のカード',type:qs('#m-type').value,cost:clampInt(qs('#m-cost').value,0,6,1),rarity:qs('#m-rarity').value,startingCount:clampInt(qs('#m-start').value,0,20,0),damage:clampInt(qs('#m-dmg').value,0,999,0),block:clampInt(qs('#m-block').value,0,999,0),draw:clampInt(qs('#m-draw').value,0,20,0),energy:clampInt(qs('#m-energy').value,0,20,0),strength:clampInt(qs('#m-str').value,0,99,0),tempStrengthTurns:clampInt(qs('#m-strt').value,0,99,0),metallicize:clampInt(qs('#m-met').value,0,99,0),tempMetallicizeTurns:clampInt(qs('#m-mett').value,0,99,0),permanentStrength:clampInt(qs('#m-pstr').value,0,99,0),permanentMetallicize:clampInt(qs('#m-pmet').value,0,99,0),weak:clampInt(qs('#m-weak').value,0,99,0),weakTurns:clampInt(qs('#m-weakt').value,0,99,0),vulnerable:clampInt(qs('#m-vuln').value,0,99,0),vulnerableTurns:clampInt(qs('#m-vulnt').value,0,99,0),poison:clampInt(qs('#m-poison').value,0,99,0),poisonTurns:clampInt(qs('#m-poisont').value,0,99,0),burn:clampInt(qs('#m-burn').value,0,99,0),burnTurns:clampInt(qs('#m-burnt').value,0,99,0),bleed:clampInt(qs('#m-bleed').value,0,99,0),bleedTurns:clampInt(qs('#m-bleedt').value,0,99,0),heal:clampInt(qs('#m-heal').value,0,999,0),loseHp:clampInt(qs('#m-lose').value,0,999,0),target:qs('#m-target').value,tags:qs('#m-tags').value,upgrade:{damage:clampInt(qs('#m-ud').value,0,99,0),block:clampInt(qs('#m-ub').value,0,99,0)},exhaust:qs('#m-exhaust').checked};if(isNew)S.cards.push(u);else S.cards=S.cards.map(x=>x.id===u.id?u:x);await saveCards(S.cards);overlay.remove();renderEditor()}}

function buildStartingDeck(){const d=[];S.cards.forEach(c=>{for(let i=0;i<(c.startingCount||0);i++)d.push(c.id)});return d.length?d:['strike','strike','strike','defend','defend']}
function weightedPick(ex=[]){const p=S.cards.filter(c=>c.rarity!=='basic'&&!ex.includes(c.id));if(!p.length)return null;let n=Math.random()*p.reduce((s,c)=>s+(RARITY_WEIGHT[c.rarity]||10),0);for(const c of p){n-=RARITY_WEIGHT[c.rarity]||10;if(n<=0)return c}return p[p.length-1]}
function rewardChoices(){const a=[],u=[];for(let i=0;i<3;i++){const c=weightedPick(u);if(c){a.push(c);u.push(c.id)}}return a}
function makeEnemy(floor,i){const elite=floor%S.settings.eliteEvery===0,last=floor===S.settings.floorCount;let pool=ENEMY_TEMPLATES.filter(e=>last?e.boss:(elite?e.elite&&!e.boss:!e.elite));if(!pool.length)pool=ENEMY_TEMPLATES.filter(e=>!e.elite);const t=pool[Math.floor(Math.random()*pool.length)],scale=1+(Math.max(0,floor-1)*S.settings.enemyHpScalePct/100);const hp=Math.round(t.baseHp*scale);return {...t,hp,maxHp:hp,block:0,strength:0,weak:0,vulnerable:0,poison:0,poisonTurns:0,burn:0,burnTurns:0,bleed:0,bleedTurns:0,moveIdx:0,id:`e${i}`}}
function startRun(){const deck=buildStartingDeck();S.run={deck:shuffle(deck),draw:[],discard:[],exhausted:[],hand:[],player:{hp:S.settings.startingHp,maxHp:S.settings.startingHp,energy:S.settings.energyPerTurn,block:0,strength:0,metallicize:0,permanentStrength:0,permanentMetallicize:0,weak:0,vulnerable:0},floor:1,enemies:[],selectedEnemy:0,log:[],turn:0,turnPhase:'player',ended:false,gold:120,relics:[],upgrades:{},path:null};S.run.draw=S.run.deck;S.run.deck=[];renderMap()}
function log(m){S.run.log.unshift(m);S.run.log=S.run.log.slice(0,30)}
function renderMap(){const r=S.run;app().innerHTML=`<div class="screen center-screen"><p class="eyebrow">PATH OF ASH</p><h2>${r.floor}階層への進路</h2><p>次のマスを選択してください。分岐は毎回変化します。</p><div style="display:grid;gap:10px;max-width:420px;margin:24px auto"><button class="primary" data-node="battle">⚔ 戦闘</button><button data-node="event">✦ イベント</button><button data-node="shop">◇ 商店</button><button data-node="rest">🔥 休憩所</button></div><p>所持金 ${r.gold}G</p></div>`;qsa('[data-node]').forEach(b=>b.onclick=()=>enterNode(b.dataset.node))}
function enterNode(node){S.run.path=node;if(node==='battle')beginBattle();if(node==='event')renderEvent();if(node==='shop')renderShop();if(node==='rest')renderRest()}
function beginBattle(){const r=S.run;const full=[...r.draw,...r.hand,...r.discard,...r.exhausted];r.draw=shuffle(full);r.hand=[];r.discard=[];r.exhausted=[];r.enemies=[];const count=(r.floor%3===0||r.floor===S.settings.floorCount)?1:2;for(let i=0;i<count;i++)r.enemies.push(makeEnemy(r.floor,i));r.selectedEnemy=0;r.player.block=0;r.player.strength=0;r.player.metallicize=0;r.turn=0;r.log=[];log(`${r.enemies.map(e=>e.name).join(' と ')}が現れた！`);if(r.relics.includes('ember'))r.player.strength+=1;if(r.relics.includes('iron'))r.player.metallicize+=2;startPlayerTurn(true);S.screen='battle';renderBattle()}
function drawCards(n){const r=S.run;for(let i=0;i<n;i++){if(!r.draw.length){if(!r.discard.length)return;r.draw=shuffle(r.discard);r.discard=[]}r.hand.push(r.draw.pop())}}
function startPlayerTurn(first){const r=S.run;r.player.block=0;r.player.block+=r.player.metallicize+r.player.permanentMetallicize;if(!first){r.discard.push(...r.hand);r.hand=[]}r.player.energy=S.settings.energyPerTurn;r.turn++;drawCards(S.settings.handSize+(r.relics.includes('scholar')?1:0));r.turnPhase='player'}
function tickStatus(e,key,turnKey){if(e[key]>0){e[key]--;if(e[turnKey]<=0)e[key]=0}}
function damageEnemy(e,raw){let dmg=raw;if(S.run.player.weak>0)dmg=Math.floor(dmg*.75);if(e.vulnerable>0)dmg=Math.floor(dmg*1.5);const b=Math.min(e.block,dmg);e.block-=b;dmg-=b;e.hp=Math.max(0,e.hp-dmg);return dmg+b}
function damagePlayer(raw){const r=S.run,p=r.player;let dmg=raw;const b=Math.min(p.block,dmg);p.block-=b;dmg-=b;p.hp=Math.max(0,p.hp-dmg);return dmg+b}
function applyCardEffect(c,target){const r=S.run,p=r.player;c=effective(c);const targets=c.target==='all'?r.enemies.filter(e=>e.hp>0):[target];if(c.damage){for(const e of targets)damageEnemy(e,c.damage+p.strength)}if(c.block)p.block+=c.block;if(c.draw)drawCards(c.draw);if(c.energy)p.energy+=c.energy;if(c.strength){p.strength+=c.strength;if(c.tempStrengthTurns===0)c.tempStrengthTurns=1;r.tempStrengthTurns=c.tempStrengthTurns}if(c.metallicize){p.metallicize+=c.metallicize;if(c.tempMetallicizeTurns===0)c.tempMetallicizeTurns=1;r.tempMetallicizeTurns=c.tempMetallicizeTurns}if(c.permanentStrength)p.permanentStrength+=c.permanentStrength;if(c.permanentMetallicize)p.permanentMetallicize+=c.permanentMetallicize;if(c.heal)p.hp=Math.min(p.maxHp,p.hp+c.heal);if(c.loseHp)p.hp=Math.max(0,p.hp-c.loseHp);for(const e of targets){if(c.weak){e.weak=Math.max(e.weak,c.weak);e.weakTurns=Math.max(e.weakTurns,c.weakTurns||1)}if(c.vulnerable){e.vulnerable=Math.max(e.vulnerable,c.vulnerable);e.vulnerableTurns=Math.max(e.vulnerableTurns,c.vulnerableTurns||1)}if(c.poison){e.poison=Math.max(e.poison,c.poison);e.poisonTurns=Math.max(e.poisonTurns,c.poisonTurns||1)}if(c.burn){e.burn=Math.max(e.burn,c.burn);e.burnTurns=Math.max(e.burnTurns,c.burnTurns||1)}if(c.bleed){e.bleed=Math.max(e.bleed,c.bleed);e.bleedTurns=Math.max(e.bleedTurns,c.bleedTurns||1)}}}
function playCard(i){const r=S.run;if(r.turnPhase!=='player')return;const id=r.hand[i],c0=cardById(id);if(!c0)return;const c=effective(c0);if(c.cost>r.player.energy)return;const target=r.enemies[r.selectedEnemy]||r.enemies.find(e=>e.hp>0);if(c.target==='enemy'&&!target)return;r.player.energy-=c.cost;applyCardEffect(c,target);log(`${c.name}を使用。`);r.hand.splice(i,1);if(c.exhaust)r.exhausted.push(id);else r.discard.push(id);if(r.player.hp<=0)return lose();if(r.enemies.every(e=>e.hp<=0))return winBattle();renderBattle()}
function endPlayerTurn(){const r=S.run;if(r.turnPhase!=='player')return;r.turnPhase='enemy';renderBattle();setTimeout(enemyTurn,350)}
function enemyTurn(){const r=S.run;if(r.ended)return;for(const e of r.enemies){if(e.hp<=0)continue;if(e.poison>0){damageEnemySelf(e,e.poison);e.poisonTurns--;if(e.poisonTurns<=0)e.poison=0}if(e.burn>0){damageEnemySelf(e,e.burn);e.burnTurns--;if(e.burnTurns<=0)e.burn=0}if(e.bleed>0){damageEnemySelf(e,e.bleed);e.bleedTurns--;if(e.bleedTurns<=0)e.bleed=0}if(e.hp<=0)continue;const m=e.moves[e.moveIdx%e.moves.length];if(m.type==='attack')damagePlayer(m.damage+e.strength);else if(m.type==='defend')e.block+=m.block;else if(m.type==='buff')e.strength+=m.strength;if(e.boss&&r.turn%3===0){e.block+=12;log(`${e.name}のボスギミック：灰燼の結界。ブロック+12。`)}e.moveIdx++;tickStatus(e,'weak','weakTurns');tickStatus(e,'vulnerable','vulnerableTurns');if(r.player.hp<=0)return lose()}r.player.strength=Math.max(0,r.player.strength-(r.tempStrengthTurns?0:0));if(r.tempStrengthTurns){r.tempStrengthTurns--;if(r.tempStrengthTurns<=0)r.player.strength=0}if(r.tempMetallicizeTurns){r.tempMetallicizeTurns--;if(r.tempMetallicizeTurns<=0)r.player.metallicize=0}startPlayerTurn(false);renderBattle()}
function damageEnemySelf(e,n){e.hp=Math.max(0,e.hp-n)}
function winBattle(){const r=S.run;r.enemies=[];r.player.strength=0;r.player.metallicize=0;r.tempStrengthTurns=0;r.tempMetallicizeTurns=0;r.gold+=25;renderReward()}
function lose(){S.run.ended=true;renderDefeat()}
function renderBattle(){const r=S.run,alive=r.enemies.filter(e=>e.hp>0);app().innerHTML=`<div class="screen"><div class="topbar"><div><p class="eyebrow">BATTLE</p><h2>${r.floor}階層</h2></div><div>💰 ${r.gold}G</div></div><div class="floor-progress">敵をクリックして対象を選択。複数敵戦あり。</div><div class="enemy-row">${r.enemies.map((e,i)=>`<div class="enemy-card ${i===r.selectedEnemy?'selected':''}" data-e="${i}"><div class="enemy-emoji">${e.emoji}</div><h3>${e.name}</h3><div>HP ${e.hp}/${e.maxHp}　🛡 ${e.block}</div><div class="chips">${e.strength?`💪${e.strength}`:''} ${e.weak?`😮‍💨${e.weak}(${e.weakTurns}T)`:''} ${e.vulnerable?`🎯${e.vulnerable}(${e.vulnerableTurns}T)`:''} ${e.poison?`☠${e.poison}`:''} ${e.burn?`🔥${e.burn}`:''} ${e.bleed?`🩸${e.bleed}`:''}</div></div>`).join('')}</div><div class="battle-mid"><div><h3>あなた</h3><p>HP ${r.player.hp}/${r.player.maxHp}　🛡${r.player.block}　⚡${r.player.energy}</p><p>💪${r.player.strength}　🛡${r.player.metallicize+r.player.permanentMetallicize}　永続筋力${r.player.permanentStrength}</p><div class="hand-row" id="hand-row">${r.hand.map((id,i)=>{const c=cardById(id);return `<div data-i="${i}">${renderCardHTML(c)}</div>`}).join('')}</div><button class="primary" id="end">ターン終了</button></div><div class="battle-log"><h3>ログ</h3>${r.log.map(x=>`<div>${x}</div>`).join('')}</div></div></div>`;qsa('.enemy-card').forEach(x=>x.onclick=()=>{r.selectedEnemy=+x.dataset.e;renderBattle()});qsa('#hand-row > div').forEach(x=>x.onclick=()=>playCard(+x.dataset.i));qs('#end').onclick=endPlayerTurn}
function renderReward(){const r=S.run,cs=rewardChoices();app().innerHTML=`<div class="screen center-screen"><p class="eyebrow">REWARD</p><h2>戦利品</h2><p>カードを1枚選ぶか、強化を選べます。</p><div class="reward-row">${cs.map((c,i)=>`<div data-r="${i}">${renderCardHTML(c)}</div>`).join('')}</div><div><button id="upgrade">ランダムなカードを強化</button><button id="skip">スキップ</button></div></div>`;qsa('[data-r]').forEach(x=>x.onclick=()=>{const c=cs[+x.dataset.r];r.discard.push(c.id);advanceFloor()});qs('#upgrade').onclick=()=>upgradeRandom();qs('#skip').onclick=advanceFloor}
function upgradeRandom(){const ids=[...new Set(S.run.deck.concat(S.run.draw,S.run.discard,S.run.hand))];if(!ids.length)return advanceFloor();const id=ids[Math.floor(Math.random()*ids.length)];S.run.upgrades[id]=(S.run.upgrades[id]||0)+1;log(`${cardById(id)?.name||id}を強化した。`);advanceFloor()}
function advanceFloor(){if(S.run.floor>=S.settings.floorCount){S.screen='victory';renderVictory();return}S.run.floor++;renderMap()}
function renderRest(){const r=S.run,heal=Math.round(r.player.maxHp*S.settings.restHealPct/100);app().innerHTML=`<div class="screen center-screen"><p class="eyebrow">SANCTUARY</p><h2>休憩所</h2><button class="primary" id="heal">休む（HP +${heal}）</button><button id="smith">カードを強化する</button><button id="skip">そのまま進む</button></div>`;qs('#heal').onclick=()=>{r.player.hp=Math.min(r.player.maxHp,r.player.hp+heal);advanceFloor()};qs('#smith').onclick=()=>{const ids=[...new Set(r.deck.concat(r.draw,r.discard))];if(ids.length){const id=ids[Math.floor(Math.random()*ids.length)];r.upgrades[id]=(r.upgrades[id]||0)+1}advanceFloor()};qs('#skip').onclick=advanceFloor}
function renderEvent(){const r=S.run,events=[['灰の祭壇','HPを10失って100G得る','hp'],['古い書庫','カードを1枚削除する','remove'],['旅商人の落とし物','ランダムなレリックを得る','relic']];const e=events[Math.floor(Math.random()*events.length)];app().innerHTML=`<div class="screen center-screen"><p class="eyebrow">EVENT</p><h2>${e[0]}</h2><p>${e[1]}</p><button class="primary" id="do">選択する</button></div>`;qs('#do').onclick=()=>{if(e[2]==='hp'){r.player.hp=Math.max(1,r.player.hp-10);r.gold+=100}else if(e[2]==='remove'){renderRemove(advanceFloor);return}else{const x=RELICS[Math.floor(Math.random()*RELICS.length)];if(!r.relics.includes(x.id))r.relics.push(x.id)}advanceFloor()}}
function renderRemove(done){const r=S.run,ids=[...new Set(r.deck.concat(r.draw,r.discard))];app().innerHTML=`<div class="screen center-screen"><h2>削除するカードを選ぶ</h2><div class="reward-row">${ids.map((id,i)=>`<div data-id="${id}">${renderCardHTML(cardById(id))}</div>`).join('')}</div></div>`;qsa('[data-id]').forEach(x=>x.onclick=()=>{const id=x.dataset.id;r.deck=r.deck.filter(a=>a!==id);r.draw=r.draw.filter(a=>a!==id);r.discard=r.discard.filter(a=>a!==id);r.hand=r.hand.filter(a=>a!==id);done()})}
function renderShop(){const r=S.run,cs=rewardChoices().slice(0,2),rel=RELICS.filter(x=>!r.relics.includes(x.id))[0];app().innerHTML=`<div class="screen center-screen"><p class="eyebrow">SHOP</p><h2>灰燼の商店</h2><p>所持金 ${r.gold}G</p><div class="reward-row">${cs.map((c,i)=>`<div><p>${c.name} 50G</p>${renderCardHTML(c)}<button data-buy="${i}">購入</button></div>`).join('')}</div>${rel?`<p>${rel.name} ${rel.cost}G</p><button id="relic">レリック購入</button>`:''}<button id="remove">カード削除 75G</button><button id="leave">退店</button></div>`;qsa('[data-buy]').forEach(b=>b.onclick=()=>{if(r.gold>=50){r.gold-=50;r.discard.push(cs[+b.dataset.buy].id);b.disabled=true}});if(qs('#relic'))qs('#relic').onclick=()=>{if(r.gold>=rel.cost){r.gold-=rel.cost;r.relics.push(rel.id);qs('#relic').disabled=true}};qs('#remove').onclick=()=>{if(r.gold>=75){r.gold-=75;renderRemove(advanceFloor)}};qs('#leave').onclick=advanceFloor}
function renderVictory(){app().innerHTML=`<div class="screen center-screen"><p class="eyebrow">THE CODEX CLOSES</p><h2>探索を制覇した！</h2><button class="primary" id="home">ホームへ戻る</button></div>`;qs('#home').onclick=()=>{S.screen='home';renderHome()}}
function renderDefeat(){app().innerHTML=`<div class="screen center-screen"><p class="eyebrow">THE ASH CLAIMS YOU</p><h2>力尽きた…</h2><p>${S.run.floor}階層目で倒れた。</p><button class="primary" id="home">ホームへ戻る</button></div>`;qs('#home').onclick=()=>{S.screen='home';renderHome()}}

async function boot(){app().innerHTML='<div class="center-screen"><p class="eyebrow">LOADING</p><h2>書庫を開いている…</h2></div>';S.cards=await loadCards();S.settings=await loadSettings();await saveCards(S.cards);S.screen='home';renderHome()}
boot();
})();

</script>
</body>
