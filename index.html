<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灰燼の書庫 -Ashbound Codex-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #14110F;
    --bg-panel: #1D1812;
    --bg-panel-raised: #262019;
    --line: #3A3025;
    --parchment: #EDE3D0;
    --parchment-dim: #C9BC9F;
    --ink: #211C16;
    --ink-soft: #4a4030;
    --ember: #C1502E;
    --ember-dim: #7a3620;
    --steel: #4C7A8C;
    --steel-dim: #33525e;
    --violet: #7A5FA0;
    --violet-dim: #4f3d6a;
    --gold: #D4A73E;
    --hp-red: #A63A3A;
    --poison-green: #6C8A3E;
    --font-display: 'Shippori Mincho', serif;
    --font-en: 'Cormorant Garamond', serif;
    --font-ui: 'Zen Kaku Gothic New', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #2a2015 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #1a1410 0%, transparent 55%),
      var(--bg-void);
    color:var(--parchment);
    font-family:var(--font-ui);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:16px;
  }
  #app{ width:100%; max-width:960px; }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0;}
  .eyebrow{ font-family:var(--font-en); letter-spacing:.04em; color:var(--parchment-dim); font-size:13px; margin:0 0 4px;}
  button{
    font-family:var(--font-ui);
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-panel-raised);
    color:var(--parchment);
    border-radius:3px;
    padding:10px 18px;
    font-size:14px;
    transition:all .12s ease;
  }
  button:hover:not(:disabled){ border-color:var(--gold); color:var(--gold); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.primary{ background:linear-gradient(180deg,#c1502e,#93381e); border-color:#7a3620; color:#f5e9d8; font-weight:600;}
  button.primary:hover:not(:disabled){ color:#fff; border-color:var(--gold); }
  button.ghost{ background:transparent; }
  input[type=text],input[type=number],select,textarea{
    background:var(--bg-void); border:1px solid var(--line); color:var(--parchment);
    padding:8px 10px; border-radius:3px; font-family:var(--font-ui); font-size:14px; width:100%;
  }
  label{ font-size:12.5px; color:var(--parchment-dim); display:block; margin-bottom:4px;}
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:12px; }
  .row > .field{ flex:1; }
  .hidden{ display:none !important; }
  .screen{ animation:fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Home ---------- */
  .home-hero{ text-align:center; padding:60px 20px 40px; }
  .home-hero .eyebrow{ text-align:center; }
  .home-hero h1{ font-size:44px; color:var(--parchment); }
  .home-hero .sub{ font-family:var(--font-en); font-style:italic; color:var(--parchment-dim); font-size:18px; margin-top:6px;}
  .home-actions{ display:flex; flex-direction:column; gap:10px; max-width:280px; margin:36px auto 0; }
  .home-actions button{ padding:14px; font-size:15px; }
  .home-foot{ text-align:center; color:var(--ink-soft); font-size:12px; margin-top:30px;}

  /* ---------- Top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .topbar h2{ font-size:20px; }
  .topbar .eyebrow{ margin:0; }

  /* ---------- Card visual ---------- */
  .card{
    width:150px; min-width:150px; height:210px; border-radius:8px;
    background:linear-gradient(180deg,#f2e9d8,var(--parchment));
    color:var(--ink); position:relative; display:flex; flex-direction:column;
    border:2px solid #8a7752; box-shadow:0 4px 10px rgba(0,0,0,.4);
    overflow:hidden; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    flex-shrink:0;
  }
  .card:hover{ transform:translateY(-10px); box-shadow:0 12px 20px rgba(0,0,0,.5); }
  .card.unplayable{ filter:grayscale(.6) brightness(.7); cursor:default; }
  .card.unplayable:hover{ transform:none; }
  .card .banner{ height:34px; display:flex; align-items:center; padding:0 10px; }
  .card.type-attack .banner{ background:linear-gradient(90deg,var(--ember),var(--ember-dim)); }
  .card.type-skill .banner{ background:linear-gradient(90deg,var(--steel),var(--steel-dim)); }
  .card.type-power .banner{ background:linear-gradient(90deg,var(--violet),var(--violet-dim)); }
  .card .cost{
    position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%;
    background:var(--ink); color:var(--gold); font-family:var(--font-en); font-weight:700;
    display:flex; align-items:center; justify-content:center; font-size:14px; border:2px solid var(--gold); z-index:2;
  }
  .card .name{ color:#fff; font-family:var(--font-display); font-size:12.5px; font-weight:700; padding-left:24px; line-height:1.2; }
  .card .art{ flex:1; background:repeating-linear-gradient(135deg,#dfd2b6,#dfd2b6 8px,#d4c5a4 8px,#d4c5a4 16px); position:relative;}
  .card.type-attack .art{ background:repeating-linear-gradient(135deg,#e7cdb8,#e7cdb8 8px,#dcb99a 8px,#dcb99a 16px);}
  .card.type-skill .art{ background:repeating-linear-gradient(135deg,#cfe0e3,#cfe0e3 8px,#c0d4d8 8px,#c0d4d8 16px);}
  .card.type-power .art{ background:repeating-linear-gradient(135deg,#ded3ea,#ded3ea 8px,#d0c0e0 8px,#d0c0e0 16px);}
  .card .desc{ font-size:11px; line-height:1.35; padding:7px 8px; background:var(--parchment); min-height:56px;}
  .card .rarity-dot{ position:absolute; bottom:5px; right:7px; font-size:9px; letter-spacing:.03em; color:var(--ink-soft); font-family:var(--font-en); }

  /* small card for editor list */
  .card.mini{ width:120px; height:168px; }
  .card.mini .name{ font-size:11px; }
  .card.mini .desc{ font-size:9.5px; min-height:44px; }

  /* ---------- Battle screen ---------- */
  .battlefield{ display:flex; justify-content:space-between; align-items:flex-start; padding:10px 6px 20px; gap:10px;}
  .combatant{ text-align:center; width:150px; }
  .combatant .portrait{
    width:110px; height:110px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
    font-size:44px; border:2px solid var(--line); background:radial-gradient(circle at 35% 30%, #362b1c, #14110f);
  }
  .combatant.enemy .portrait{ border-color:var(--ember-dim); }
  .combatant.player .portrait{ border-color:var(--steel-dim); }
  .combatant .cname{ font-family:var(--font-display); font-size:15px; margin-bottom:4px;}
  .hpbar-wrap{ background:#000; border:1px solid var(--line); border-radius:10px; height:16px; overflow:hidden; position:relative; }
  .hpbar-fill{ height:100%; background:linear-gradient(90deg,#7a2020,var(--hp-red)); transition:width .3s ease; }
  .hpbar-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-family:var(--font-en); font-weight:700; text-shadow:0 1px 2px #000;}
  .statuses{ display:flex; gap:5px; justify-content:center; margin-top:6px; flex-wrap:wrap;}
  .status-chip{ font-size:10.5px; background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:10px; padding:2px 7px;}
  .intent{ margin-top:8px; font-size:12px; color:var(--parchment-dim); background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:5px; padding:5px 8px; min-height:16px;}
  .intent.atk{ color:#e39a7f;}
  .intent.def{ color:#9fc3ce;}
  .intent.buf{ color:#c4a8de;}

  .vsmark{ font-family:var(--font-en); font-size:26px; color:var(--line); margin-top:36px; }

  .hand-zone{ background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:16px 10px; margin-top:8px;}
  .hand-row{ display:flex; gap:10px; overflow-x:auto; padding:6px 4px 14px; justify-content:center; flex-wrap:wrap; }
  .battle-controls{ display:flex; align-items:center; justify-content:space-between; padding:0 6px;}
  .pile-info{ display:flex; gap:14px; font-size:12.5px; color:var(--parchment-dim); }
  .energy-badge{
    display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f0d488, var(--gold)); color:#3a2a06; font-family:var(--font-en); font-weight:700; font-size:18px; border:2px solid #8a6a1e;
  }
  .floor-progress{ font-size:12px; color:var(--parchment-dim); text-align:center; margin-bottom:6px;}

  .log-box{ font-size:12px; color:var(--parchment-dim); background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; max-height:70px; overflow-y:auto; margin-top:10px;}
  .log-box div{ margin-bottom:2px; }

  /* ---------- Reward / result screens ---------- */
  .center-screen{ text-align:center; padding:30px 10px; }
  .reward-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:24px 0; }

  /* ---------- Editor list ---------- */
  .editor-grid{ display:flex; gap:14px; flex-wrap:wrap; }
  .editor-card-wrap{ position:relative; }
  .editor-card-wrap .edit-actions{ display:flex; gap:4px; margin-top:6px; justify-content:center;}
  .editor-card-wrap .edit-actions button{ padding:4px 8px; font-size:11px; }
  .add-card-tile{
    width:120px; height:168px; border:2px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--parchment-dim); font-size:32px; cursor:pointer;
  }
  .add-card-tile:hover{ border-color:var(--gold); color:var(--gold); }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(10,8,6,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal-box{ background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:22px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;}
  .modal-box h3{ margin-bottom:16px; font-size:18px;}
  .checkbox-field{ display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .checkbox-field input{ width:auto; }
  .checkbox-field label{ margin:0; color:var(--parchment); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .section-label{ font-family:var(--font-en); font-style:italic; color:var(--gold); font-size:13px; margin:16px 0 8px; border-top:1px solid var(--line); padding-top:12px;}

  /* ---------- Settings ---------- */
  .settings-card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:20px; max-width:520px; margin:0 auto;}
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>

const DEFAULT_SETTINGS = {
  startingHp: 70,
  energyPerTurn: 3,
  handSize: 5,
  floorCount: 8,
  eliteEvery: 4,
  enemyHpScalePct: 12, // % increase per floor
  restHealPct: 30,
};

/* ============================= STORAGE ============================= */

// Older saves may have "timing"/"triggerTag"/"duration" nested inside cardOp
// (from before those settings applied to the whole card). Lift them to the top level.
function migrateCard(c){
  if(c && c.cardOp && c.cardOp.timing!==undefined){
    if(c.timing===undefined) c.timing = c.cardOp.timing;
    if(c.triggerTag===undefined) c.triggerTag = c.cardOp.triggerTag;
    if(c.duration===undefined) c.duration = c.cardOp.duration;
    delete c.cardOp.timing;
    delete c.cardOp.triggerTag;
    delete c.cardOp.duration;
  }
  return c;
}
function loadCards(){
  try{
    const value = localStorage.getItem('cards');
    if(value) return JSON.parse(value).map(migrateCard);
  }catch(e){ console.error(e); }
  return DEFAULT_CARDS;
}
function saveCards(cards){
  try{ localStorage.setItem('cards', JSON.stringify(cards)); }catch(e){ console.error(e); }
}
function loadSettings(){
  try{
    const value = localStorage.getItem('settings');
    if(value) return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(value));
  }catch(e){ console.error(e); }
  return {...DEFAULT_SETTINGS};
}
function saveSettings(s){
  try{ localStorage.setItem('settings', JSON.stringify(s)); }catch(e){ console.error(e); }
}
function loadRelics(){
  try{
    const value = localStorage.getItem('relics');
    if(value) return JSON.parse(value);
  }catch(e){ console.error(e); }
  return DEFAULT_RELICS;
}
function saveRelics(relics){
  try{ localStorage.setItem('relics', JSON.stringify(relics)); }catch(e){ console.error(e); }
}

/* ============================= APP STATE ============================= */

const S = {
  screen: 'loading',
  cards: [],
  relics: [],
  settings: {...DEFAULT_SETTINGS},
  run: null, // battle/run state
  editingCard: null,
  editingIsNew: false,
};

// A pile entry is normally just a card id string (e.g. "strike" or "strike+" once
// upgraded). When a card grants an effect to another card (cardOp type "grantBuff"),
// that specific physical copy needs its own identity so the bonus doesn't leak onto
// every other copy of the same card. We do this by suffixing the raw id with
// "::<instanceId>" and storing the actual bonus numbers in S.run.instanceBuffs,
// keyed by that instance id. Every other part of the game keeps treating pile
// entries as opaque strings (splice/indexOf/etc. all still work unchanged) — only
// cardById() needs to know how to unpack the suffix.
function splitInstanceId(raw){
  if(typeof raw!=='string') return {cid:raw, iid:null};
  const idx = raw.lastIndexOf('::');
  if(idx===-1) return {cid:raw, iid:null};
  return {cid:raw.slice(0,idx), iid:raw.slice(idx+2)};
}
function withInstanceSuffix(cid, iid){ return iid ? (cid+'::'+iid) : cid; }
function upgradeRawId(raw){
  const {cid, iid} = splitInstanceId(raw);
  if(cid.endsWith('+')) return raw;
  return withInstanceSuffix(cid+'+', iid);
}

// Cards created by a "generate" card-operation only exist for the current combat.
// Their instance id is registered in r.temporaryCardIids; this strips any such card
// out of every pile (and drops its buff record) once the fight is over.
function purgeTemporaryCards(r){
  if(!r.temporaryCardIids) { r.temporaryCardIids = {}; return; }
  const isTemp = (rawId)=>{
    const {iid} = splitInstanceId(rawId);
    return !!(iid && r.temporaryCardIids[iid]);
  };
  ['hand','draw','discard','exhausted'].forEach(pileName=>{
    if(!r[pileName]) return;
    r[pileName] = r[pileName].filter(rawId=>{
      if(isTemp(rawId)){
        const {iid} = splitInstanceId(rawId);
        if(r.instanceBuffs) delete r.instanceBuffs[iid];
        return false;
      }
      return true;
    });
  });
  r.temporaryCardIids = {};
}

function isUpgradedInstanceId(raw){
  const cid = splitInstanceId(raw).cid;
  return typeof cid==='string' && cid.endsWith('+');
}

function upgradedCardView(base){
  const up = {...base, id: base.id+'+', name: base.name+'+', baseId: base.id};
  const upg = base.upgrades || {};
  up.cost = Math.max(0, (base.cost||0) + (upg.costDelta||0));
  up.scales = {};
  EFFECT_FIELD_DEFS.forEach(def=>{
    const baseVal = base[def.key]!==undefined ? base[def.key] : (def.default||0);
    const min = def.min!==undefined ? def.min : 0;
    up[def.key] = Math.max(min, baseVal + (upg[def.key]||0));
    if(base.scales && base.scales[def.key]){
      const s = base.scales[def.key];
      const ppDelta = (upg.scalePP && upg.scalePP[def.key]) || 0;
      up.scales[def.key] = {...s, perPoint: s.perPoint + ppDelta};
    }
  });
  return up;
}

function cardById(id){
  const {cid, iid} = splitInstanceId(id);
  let card;
  if(isUpgradedInstanceId(cid)){
    const base = S.cards.find(c=>c.id===cid.slice(0,-1));
    card = base ? upgradedCardView(base) : null;
  } else {
    card = S.cards.find(c=>c.id===cid);
  }
  if(!card) return null;
  const buffs = iid && S.run && S.run.instanceBuffs && S.run.instanceBuffs[iid];
  if(buffs && Object.keys(buffs).length){
    const merged = {...card};
    Object.keys(buffs).forEach(k=>{ merged[k] = (merged[k]||0) + buffs[k]; });
    return merged;
  }
  return card;
}

/* ============================= CARD TEXT ============================= */

function cardDescription(c){
  const parts = [];
  EFFECT_FIELD_DEFS.forEach(def=>{
    const base = c[def.key]!==undefined ? c[def.key] : (def.default||0);
    const show = def.showIf ? def.showIf(base) : base>0;
    if(show) parts.push(def.desc(base));
    const scale = c.scales && c.scales[def.key];
    if(scale && scale.source && scale.source!=='none' && scale.perPoint){
      const src = SCALE_SOURCES.find(s=>s.key===scale.source);
      const label = src ? src.label : scale.source;
      const tagPart = (scale.source==='tagCountHand'||scale.source==='tagCountPlayedThisTurn'||scale.source==='tagCountDrawDiscard') && scale.tag ? `[${scale.tag}]` : '';
      parts.push(`${def.label}: ${label}${tagPart}×${scale.perPoint}`);
    }
  });
  if(c.pierce) parts.push('ブロックを無視する（貫通）');
  if(c.lifesteal) parts.push('与えたダメージ分HP回復（吸血）');
  if(c.retain) parts.push('ターンをまたいで手札に残る（保持）');
  if(c.cardOp && c.cardOp.enabled){
    const isGenerate = GENERATE_TYPES.includes(c.cardOp.type);
    const typeLabel = (CARDOP_TYPES.find(t=>t.key===c.cardOp.type)||{}).label || c.cardOp.type;
    const rangeLabel = isGenerate
      ? ((GENERATE_POOL_OPTIONS.find(p=>p.key===c.cardOp.genPool)||{}).label || c.cardOp.genPool)
      : ((PILE_OPTIONS.find(p=>p.key===c.cardOp.fromPile)||{}).label || c.cardOp.fromPile);
    const countText = c.cardOp.countMode==='all' ? '対象すべて'
      : c.cardOp.countMode==='choose' ? `任意の${c.cardOp.countFixed}枚`
      : c.cardOp.countMode==='random' ? `${c.cardOp.countMin}〜${c.cardOp.countMax}枚`
      : `${c.cardOp.countFixed}枚`;
    const tagText = c.cardOp.filterTag ? `[${c.cardOp.filterTag}]の` : '';
    if(c.cardOp.type==='grantBuff'){
      const fieldDef = EFFECT_FIELD_DEFS.find(d=>d.key===c.cardOp.buffField);
      const fieldLabel = fieldDef ? fieldDef.label : c.cardOp.buffField;
      const amt = c.cardOp.buffAmount||0;
      parts.push(`${rangeLabel}の${tagText}カードを${countText}選び、「${fieldLabel}」を${amt>=0?'+':''}${amt}する`);
    } else if(isGenerate){
      parts.push(`${rangeLabel}${tagText?`（${tagText.slice(0,-1)}）`:''}から${countText}${typeLabel}`);
    } else {
      parts.push(`${rangeLabel}の${tagText}カードを${countText}${typeLabel}`);
    }
  }
  if(c.tags && c.tags.length) parts.push(`タグ: ${c.tags.join(', ')}`);
  if(c.exhaust) parts.push(`(使用後: 消滅)`);
  let desc = parts.length ? parts.join('。')+'。' : '効果なし';
  if(c.timing==='trigger'){
    const tagPart = c.triggerTag ? `[${c.triggerTag}]` : '任意の';
    const durPart = c.duration==='turn' ? 'このターンのみ' : 'この戦闘中';
    desc = `【仕込み】今後${tagPart}カードを使うたびに発動（${durPart}）: ` + desc;
  }
  return desc;
}

const SCALE_SOURCES = [
  {key:'none', label:'なし'},
  {key:'playerStrength', label:'自分の強化（合計）'},
  {key:'playerMetallicize', label:'自分の自動ブロック（合計）'},
  {key:'playerBlock', label:'自分の現在ブロック'},
  {key:'playerGold', label:'自分の所持ゴールド'},
  {key:'playerMissingHp', label:'自分が失っているHP'},
  {key:'playerHandSize', label:'自分の手札枚数'},
  {key:'playerDrawSize', label:'自分の山札枚数'},
  {key:'playerDiscardSize', label:'自分の捨て札枚数'},
  {key:'playerDrawDiscardSize', label:'自分の山札+捨て札枚数（合計）'},
  {key:'enemyWeak', label:'敵の弱体値'},
  {key:'enemyVulnerable', label:'敵の脆弱値'},
  {key:'enemyPoison', label:'敵の毒値'},
  {key:'enemyBlock', label:'敵の現在ブロック'},
  {key:'enemyStrength', label:'敵の強化値'},
  {key:'cardsPlayedThisTurn', label:'このターンに使ったカード枚数'},
  {key:'tagCountHand', label:'手札内の指定タグ枚数'},
  {key:'tagCountPlayedThisTurn', label:'このターン使った指定タグ枚数'},
  {key:'tagCountDrawDiscard', label:'山札+捨て札内の指定タグ枚数（合計）'},
];
function scaleSourceValue(key, tag){
  const r = S.run; if(!r) return 0;
  const p = r.player; const e = r.enemy;
  switch(key){
    case 'playerStrength': return p.strength + p.permStrength;
    case 'playerMetallicize': return p.metallicize + p.permMetallicize;
    case 'playerBlock': return p.block;
    case 'playerGold': return p.gold;
    case 'playerMissingHp': return Math.max(0, p.maxHp - p.hp);
    case 'playerHandSize': return r.hand.length;
    case 'playerDrawSize': return r.draw.length;
    case 'playerDiscardSize': return r.discard.length;
    case 'playerDrawDiscardSize': return r.draw.length + r.discard.length;
    case 'enemyWeak': return e ? e.weak : 0;
    case 'enemyVulnerable': return e ? e.vulnerable : 0;
    case 'enemyPoison': return e ? e.poison : 0;
    case 'enemyBlock': return e ? e.block : 0;
    case 'enemyStrength': return e ? e.strength : 0;
    case 'cardsPlayedThisTurn': return r.cardsPlayedThisTurn || 0;
    case 'tagCountHand': return tag ? r.hand.filter(cid=>{ const c=cardById(cid); return c && c.tags && c.tags.includes(tag); }).length : 0;
    case 'tagCountPlayedThisTurn': return tag ? (r.tagsPlayedThisTurn||[]).filter(t=>t===tag).length : 0;
    case 'tagCountDrawDiscard': return tag ? [...r.draw, ...r.discard].filter(cid=>{ const c=cardById(cid); return c && c.tags && c.tags.includes(tag); }).length : 0;
    default: return 0;
  }
}
function scaleBonus(c, field){
  const s = c.scales && c.scales[field];
  if(!s || !s.source || s.source==='none') return 0;
  return Math.floor((s.perPoint||0) * scaleSourceValue(s.source, s.tag));
}

/* ============================= CARD OPERATIONS (advanced) ============================= */

const CARDOP_TYPES = [
  {key:'moveToHand', label:'手札に移動する'},
  {key:'moveToDiscard', label:'捨て札に移動する'},
  {key:'moveToDraw', label:'山札に加える（シャッフル）'},
  {key:'moveToExhausted', label:'消滅させる'},
  {key:'upgrade', label:'その場で強化する'},
  {key:'duplicate', label:'複製する（捨て札に複製を追加）'},
  {key:'play', label:'コストを消費せず使用する'},
  {key:'grantBuff', label:'カードに効果を付与する'},
  {key:'generateToHand', label:'カードを生成し、手札に加える'},
  {key:'generateToDraw', label:'カードを生成し、山札に加える'},
  {key:'generatePlay', label:'カードを生成し、コストを消費せず使用する'},
];
const GENERATE_TYPES = ['generateToHand','generateToDraw','generatePlay'];
const PILE_OPTIONS = [
  {key:'hand', label:'手札'},
  {key:'draw', label:'山札'},
  {key:'discard', label:'捨て札'},
  {key:'exhausted', label:'消滅済み'},
  {key:'drawAndDiscard', label:'山札+捨て札（合算）'},
];
// A cardOp's "from pile" can point at more than one actual pile array at once
// (currently just "drawAndDiscard"). This maps the selectable key to the real
// r.<pile> array name(s) it draws candidates from.
const PILE_SOURCES = {
  hand: ['hand'], draw: ['draw'], discard: ['discard'], exhausted: ['exhausted'],
  drawAndDiscard: ['draw','discard'],
};
const GENERATE_POOL_OPTIONS = [
  {key:'normal', label:'通常のカードのみ（生成専用カードを除く）'},
  {key:'exclusiveOnly', label:'生成専用カードのみ'},
  {key:'any', label:'すべてのカード'},
];

// Every candidate a cardOp can act on is represented the same way, whether it comes
// from an existing pile (pile+idx known, so it can be moved/mutated in place) or from
// the master card list for a "generate" op (pile/idx are null — it doesn't exist yet).
function collectPileEntries(r, fromPileKey){
  const pileNames = PILE_SOURCES[fromPileKey] || [fromPileKey];
  const entries = [];
  pileNames.forEach(pn=>{
    const arr = r[pn];
    if(!arr) return;
    arr.forEach((rawId,i)=> entries.push({pile:pn, idx:i, rawId}));
  });
  return entries;
}
function collectGeneratePool(op){
  return S.cards.filter(c=>{
    if(op.filterTag && !(c.tags && c.tags.includes(op.filterTag))) return false;
    if(op.genPool==='exclusiveOnly') return !!c.generatedOnly;
    if(op.genPool==='normal') return !c.generatedOnly;
    return true; // 'any'
  }).map(c=>({pile:null, idx:null, rawId:c.id}));
}
// Removes a set of already-selected entries from their source piles. Entries are
// grouped by pile and spliced highest-index-first so earlier indices stay valid.
function removeEntries(r, entries){
  const byPile = {};
  entries.forEach(e=>{ if(e.pile) (byPile[e.pile] = byPile[e.pile]||[]).push(e.idx); });
  Object.keys(byPile).forEach(pileName=>{
    byPile[pileName].sort((a,b)=>b-a).forEach(i=> r[pileName].splice(i,1));
  });
}
function pickWithReplacement(entries, count){
  const out = [];
  if(entries.length===0) return out;
  for(let i=0;i<count;i++) out.push(entries[Math.floor(Math.random()*entries.length)]);
  return out;
}

// Resolves a single card-operation. Most operation types finish synchronously, but
// countMode "choose" hands control to the player (via r.pendingChoice) and only calls
// done() once they confirm a selection — so every caller of resolveCardOp must treat
// it as asynchronous and continue its own work from inside `done`.
function resolveCardOp(r, op, done){
  if(!op || !op.enabled){ done(); return; }
  const isGenerate = GENERATE_TYPES.includes(op.type);

  let entries = isGenerate ? collectGeneratePool(op) : collectPileEntries(r, op.fromPile || 'hand');
  if(!isGenerate && op.filterTag){
    entries = entries.filter(e=>{
      const cc = cardById(e.rawId);
      return cc && cc.tags && cc.tags.includes(op.filterTag);
    });
  }
  if(op.type==='upgrade'){
    entries = entries.filter(e=>!isUpgradedInstanceId(e.rawId));
  }
  if(entries.length===0){ done(); return; }

  function finish(selected){
    if(selected.length===0){ done(); return; }

    if(isGenerate){
      const newIds = selected.map(e=>{
        const iid = newId();
        r.temporaryCardIids[iid] = true;
        return withInstanceSuffix(e.rawId, iid);
      });
      if(op.type==='generateToHand'){
        r.hand.push(...newIds);
        pushLog(`${newIds.length}枚のカードを生成し、手札に加えた。`);
        done(); return;
      }
      if(op.type==='generateToDraw'){
        r.draw = shuffle([...r.draw, ...newIds]);
        pushLog(`${newIds.length}枚のカードを生成し、山札に加えた。`);
        done(); return;
      }
      // generatePlay
      pushLog(`${newIds.length}枚のカードを生成し、コストなしで使用した。`);
      let gi=0;
      (function nextGen(){
        if(gi>=newIds.length){ done(); return; }
        const rawId = newIds[gi++];
        const cc = cardById(rawId);
        if(!cc){ nextGen(); return; }
        if((r._autoPlayDepth||0) >= 4){
          pushLog(`${cc.name}: 連鎖が深すぎるため発動を打ち切った。`);
          r.discard.push(rawId);
          nextGen(); return;
        }
        r._autoPlayDepth = (r._autoPlayDepth||0) + 1;
        resolveCardPlayCore(r, cc, ()=>{
          r._autoPlayDepth -= 1;
          if(cc.exhaust) r.exhausted.push(rawId); else r.discard.push(rawId);
          nextGen();
        });
      })();
      return;
    }

    if(op.type==='upgrade'){
      selected.forEach(e=>{ r[e.pile][e.idx] = upgradeRawId(e.rawId); });
      pushLog(`${selected.length}枚のカードを強化した。`);
      done(); return;
    }
    if(op.type==='duplicate'){
      // A duplicate is a fresh, unbuffed copy of the base card — it does not inherit
      // any per-instance buff granted to the original physical card.
      selected.forEach(e=>{ r.discard.push(splitInstanceId(e.rawId).cid); });
      pushLog(`${selected.length}枚のカードを複製した。`);
      done(); return;
    }
    if(op.type==='grantBuff'){
      const field = op.buffField; const amount = op.buffAmount||0;
      if(field && amount){
        selected.forEach(e=>{
          const {cid, iid} = splitInstanceId(e.rawId);
          let useIid = iid;
          if(!useIid){ useIid = newId(); r.instanceBuffs[useIid] = {}; }
          r.instanceBuffs[useIid][field] = (r.instanceBuffs[useIid][field]||0) + amount;
          r[e.pile][e.idx] = withInstanceSuffix(cid, useIid);
        });
        const fieldDef = EFFECT_FIELD_DEFS.find(d=>d.key===field);
        pushLog(`${selected.length}枚のカードに「${fieldDef?fieldDef.label:field}」${amount>=0?'+':''}${amount}を付与した。`);
      }
      done(); return;
    }
    if(op.type==='play'){
      // Auto-play the targeted cards for free (no energy cost, not counted as
      // hand-play). Guard against runaway chains (a card auto-playing cards that
      // in turn auto-play more cards) with a small recursion depth cap.
      removeEntries(r, selected);
      pushLog(`${selected.length}枚のカードをコストなしで使用した。`);
      let pi=0;
      (function nextPlay(){
        if(pi>=selected.length){ done(); return; }
        const e = selected[pi++];
        const cc = cardById(e.rawId);
        if(!cc){ nextPlay(); return; }
        if((r._autoPlayDepth||0) >= 4){
          pushLog(`${cc.name}: 連鎖が深すぎるため発動を打ち切った。`);
          r.discard.push(e.rawId);
          nextPlay(); return;
        }
        r._autoPlayDepth = (r._autoPlayDepth||0) + 1;
        resolveCardPlayCore(r, cc, ()=>{
          r._autoPlayDepth -= 1;
          if(cc.exhaust) r.exhausted.push(e.rawId); else r.discard.push(e.rawId);
          nextPlay();
        });
      })();
      return;
    }
    const destMap = {moveToHand:'hand', moveToDiscard:'discard', moveToDraw:'draw', moveToExhausted:'exhausted'};
    const dest = destMap[op.type];
    if(!dest){ done(); return; }
    removeEntries(r, selected);
    const movedIds = selected.map(e=>e.rawId);
    if(dest==='draw'){ r.draw = shuffle([...r.draw, ...movedIds]); }
    else{ r[dest].push(...movedIds); }
    pushLog(`${movedIds.length}枚のカードを移動した。`);
    done();
  }

  if(op.countMode==='choose'){
    const need = Math.min(Math.max(op.countFixed!==undefined?op.countFixed:1, 0), entries.length);
    if(need<=0){ done(); return; }
    r.pendingChoice = {
      candidates: entries,
      need,
      selectedIdx: [],
      onConfirm: (chosen)=>{ finish(chosen); },
    };
    renderBattle();
    return;
  }

  let count;
  if(op.countMode==='all') count = entries.length;
  else if(op.countMode==='random'){
    const lo = Math.min(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
    const hi = Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
    count = lo + Math.floor(Math.random()*(hi-lo+1));
  } else count = op.countFixed!==undefined ? op.countFixed : 1;

  const selected = isGenerate
    ? pickWithReplacement(entries, Math.max(0,count))
    : shuffle(entries.slice()).slice(0, Math.max(0,count));
  finish(selected);
}

// Applies a card's own numeric effects (damage/block/draw/buffs/debuffs/card-op...),
// repeated according to its "hits" field. This is shared by a normal hand-play, by a
// trigger firing later, and by cardOp's "play"/"generatePlay" (free auto-play) types.
// Continuation-passing: calls done() once every repetition (and any card-op inside it,
// including ones that pause for a player choice) has fully resolved.
function applyCardEffects(r, c, done){
  const replays = Math.max(1, (c.hits||1) + scaleBonus(c,'hits'));
  let rep = 0;
  (function step(){
    if(rep>=replays || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
    rep++;
    const dmgVal = Math.max(0, (c.damage||0) + scaleBonus(c,'damage'));
    if(dmgVal>0){
      const dealt = applyDamageToEnemy(dmgVal + r.player.strength + r.player.permStrength, c.pierce);
      pushLog(`${c.name}: 敵に${dealt}ダメージ${c.pierce?'（貫通）':''}。`);
      if(c.lifesteal && dealt>0){ r.player.hp = Math.min(r.player.maxHp, r.player.hp + dealt); }
    }
    const blockVal = Math.max(0, (c.block||0) + scaleBonus(c,'block'));
    if(blockVal>0){ r.player.block += blockVal; pushLog(`${c.name}: ブロック+${blockVal}。`); }
    const drawVal = Math.max(0, (c.draw||0) + scaleBonus(c,'draw'));
    if(drawVal>0){ drawCards(drawVal); pushLog(`${c.name}: カードを${drawVal}枚引いた。`); }
    const energyVal = (c.energy||0) + scaleBonus(c,'energy');
    if(energyVal){ r.player.energy += energyVal; }
    const strengthVal = Math.max(0, (c.strength||0) + scaleBonus(c,'strength'));
    if(strengthVal>0){ r.player.strength += strengthVal; pushLog(`${c.name}: 強化+${strengthVal}（この戦闘中）。`); }
    const permStrengthVal = Math.max(0, (c.permStrength||0) + scaleBonus(c,'permStrength'));
    if(permStrengthVal>0){ r.player.permStrength += permStrengthVal; pushLog(`${c.name}: 強化+${permStrengthVal}（永続）。`); }
    const metallicizeVal = Math.max(0, (c.metallicize||0) + scaleBonus(c,'metallicize'));
    if(metallicizeVal>0){ r.player.metallicize += metallicizeVal; }
    const permMetallicizeVal = Math.max(0, (c.permMetallicize||0) + scaleBonus(c,'permMetallicize'));
    if(permMetallicizeVal>0){ r.player.permMetallicize += permMetallicizeVal; }
    const thornsVal = Math.max(0, (c.thorns||0) + scaleBonus(c,'thorns'));
    if(thornsVal>0){ r.player.thorns += thornsVal; }
    const permThornsVal = Math.max(0, (c.permThorns||0) + scaleBonus(c,'permThorns'));
    if(permThornsVal>0){ r.player.permThorns += permThornsVal; }
    const weakVal = Math.max(0, (c.weak||0) + scaleBonus(c,'weak'));
    if(weakVal>0){ r.enemy.weak += weakVal; }
    const vulnVal = Math.max(0, (c.vulnerable||0) + scaleBonus(c,'vulnerable'));
    if(vulnVal>0){ r.enemy.vulnerable += vulnVal; }
    const poisonVal = Math.max(0, (c.poison||0) + scaleBonus(c,'poison'));
    if(poisonVal>0){ r.enemy.poison += poisonVal; }
    const healVal = Math.max(0, (c.heal||0) + scaleBonus(c,'heal'));
    if(healVal>0){ r.player.hp = Math.min(r.player.maxHp, r.player.hp + healVal); }
    const loseHpVal = Math.max(0, (c.loseHp||0) + scaleBonus(c,'loseHp'));
    if(loseHpVal>0){ r.player.hp = Math.max(0, r.player.hp - loseHpVal); }

    if(c.cardOp && c.cardOp.enabled){
      resolveCardOp(r, c.cardOp, ()=>{
        if(r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
        step();
      });
    } else {
      step();
    }
  })();
}

// Shared "this card is now being used" bookkeeping: play-count/tag tracking, letting
// existing trigger-cards react, then either resolving the effect immediately or
// registering it as a new trigger, depending on the card's own timing setting.
function resolveCardPlayCore(r, c, done){
  r.cardsPlayedThisTurn = (r.cardsPlayedThisTurn||0) + 1;
  if(c.tags && c.tags.length){ r.tagsPlayedThisTurn = (r.tagsPlayedThisTurn||[]).concat(c.tags); }

  // Existing triggers (registered by earlier cards this combat/turn) react to this play,
  // before this card's own trigger (if any) is registered below.
  fireMatchingTriggers(r, c, ()=>{
    if(c.timing === 'trigger'){
      r.activeTriggers.push({
        triggerTag: c.triggerTag || '',
        duration: c.duration || 'combat',
        cardData: c,
      });
      pushLog(`${c.name}: 効果を仕込んだ（今後の該当カード使用時に発動）。`);
      done();
    } else {
      applyCardEffects(r, c, done);
    }
  });
}

function fireMatchingTriggers(r, playedCard, done){
  if(!r.activeTriggers || r.activeTriggers.length===0){ done(); return; }
  // Snapshot first: resolving a trigger can itself register new triggers (e.g. via a
  // chained "play" cardOp), and those shouldn't fire again within this same pass.
  const snapshot = r.activeTriggers.slice();
  let idx = 0;
  (function next(){
    if(idx>=snapshot.length){ done(); return; }
    const trig = snapshot[idx++];
    const tagOk = !trig.triggerTag || (playedCard.tags && playedCard.tags.includes(trig.triggerTag));
    if(tagOk) applyCardEffects(r, trig.cardData, next);
    else next();
  })();
}

function renderEditor(){
  const groups = [['basic','ベーシック'],['common','コモン'],['uncommon','アンコモン'],['rare','レア']];
  let html = `
  <div class="screen">
    <div class="topbar">

      <button class="ghost" id="btn-back">← ホームへ</button>
    </div>`;
  groups.forEach(([rar,label])=>{
    const cards = S.cards.filter(c=>c.rarity===rar);
    html += `<div class="section-label">${label}（${cards.length}種）</div><div class="editor-grid">`;
    cards.forEach(c=>{
      html += `<div class="editor-card-wrap" data-id="${c.id}">

          <button class="edit-btn">編集</button>

  qsa('.edit-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.closest('.editor-card-wrap').dataset.id;
      openCardModal(cardById(id), false);

    btn.onclick = async ()=>{

        S.cards = S.cards.filter(c=>c.id!==id);

  });
}

/* ============================= RUN / BATTLE LOGIC ============================= */

function buildStartingDeck(){
  const deck = [];
  S.cards.forEach(c=>{
    if(c.generatedOnly) return;
    for(let i=0;i<(c.startingCount||0);i++) deck.push(c.id);
  });
  if(deck.length===0){ // fallback safety
    deck.push('strike','strike','strike','defend','defend');
  }
  return deck;
}

function weightedPickCard(excludeIds){
  const pool = S.cards.filter(c=> c.rarity!=='basic' && !c.generatedOnly && !excludeIds.includes(c.id));
  if(pool.length===0) return null;
  const total = pool.reduce((s,c)=> s + (RARITY_WEIGHT[c.rarity]||10), 0);
  let r = Math.random()*total;
  for(const c of pool){
    r -= (RARITY_WEIGHT[c.rarity]||10);
    if(r<=0) return c;
  }
  return pool[pool.length-1];
}

function threeRewardCards(){
  const picks = [];
  const used = [];
  for(let i=0;i<3;i++){
    const c = weightedPickCard(used);
    if(!c) break;
    picks.push(c); used.push(c.id);
  }
  return picks;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeEnemy(floorIndex){
  const s = S.settings;
  const isElite = (floorIndex % s.eliteEvery === 0);
  const isLast = floorIndex === s.floorCount;
  let pool = ENEMY_TEMPLATES.filter(e => isLast ? e.boss : (isElite ? e.elite && !e.boss : !e.elite));
  if(pool.length===0) pool = ENEMY_TEMPLATES.filter(e=>!e.elite);
  const t = pool[Math.floor(Math.random()*pool.length)];
  const scale = 1 + (Math.max(0,floorIndex-1) * (s.enemyHpScalePct/100));
  const hp = Math.round(t.baseHp * scale);
  return {
    name: t.name, emoji: t.emoji, elite: t.elite||false, boss: t.boss||false,
    hp, maxHp: hp, block:0, strength:0, weak:0, vulnerable:0, poison:0,
    moves: t.moves, moveIdx: 0,
  };
}

function startRun(){
  const deckIds = buildStartingDeck();
  S.run = {
    deck: shuffle(deckIds),
    draw: [],
    discard: [],
    exhausted: [],
    hand: [],
    player: {
      hp: S.settings.startingHp, maxHp: S.settings.startingHp,
      energy: S.settings.energyPerTurn, block:0, strength:0, weak:0, vulnerable:0, poison:0, metallicize:0,
      permStrength:0, permMetallicize:0, thorns:0, permThorns:0, gold:0,
      extraEnergy:0, extraDraw:0, relics:[],
    },
    floor: 1,
    enemy: null,
    log: [],
    turnPhase: 'player',
    ended:false,
    lastGoldGained:0,
    currentEvent:null,
    eventResult:null,
    shopOffers:null,
    shopRemoveMode:false,
    shopUpgradeMode:false,
    shopRelic:null,
    pendingRelic:null,
    cardsPlayedThisTurn:0,
    tagsPlayedThisTurn:[],
    battlesSinceSpecial:0,
    activeTriggers:[],
    instanceBuffs:{},
    temporaryCardIids:{},
  };
  S.run.draw = shuffle(S.run.deck);
  S.run.deck = [];
  beginFloor();
}

function pushLog(msg){
  S.run.log.unshift(msg);
  if(S.run.log.length>30) S.run.log.pop();
}

function beginFloor(){
  const r = S.run;
  if(r.battlesSinceSpecial===undefined) r.battlesSinceSpecial = 0;
  const isBoss = r.floor === S.settings.floorCount;
  const isElite = r.floor % S.settings.eliteEvery === 0;
  if(!isBoss && !isElite && r.battlesSinceSpecial>=2){
    r.battlesSinceSpecial = 0;
    const roll = Math.random();
    if(roll < 0.4){ S.screen='rest'; renderRest(); return; }
    else if(roll < 0.75){ S.screen='event'; renderEvent(); return; }
    else{ S.screen='shop'; renderShop(); return; }
  }
  r.battlesSinceSpecial++;
  // Rebuild the full card pool for the new battle: everything in the draw pile,
  // hand, discard pile, and exhaust pile returns and gets reshuffled. This mirrors
  // standard deckbuilder behavior and prevents cards from being lost between floors.
  purgeTemporaryCards(r);
  const fullPool = [...r.draw, ...r.hand, ...r.discard, ...r.exhausted];
  r.draw = shuffle(fullPool);
  r.hand = [];
  r.discard = [];
  r.exhausted = [];

  // Temporary strength/metallicize/thorns are combat-only and reset here; the permanent
  // versions (permStrength/permMetallicize/permThorns) are untouched and carry across the run.
  r.player.strength = 0;
  r.player.metallicize = 0;
  r.player.thorns = 0;
  r.activeTriggers = [];

  r.enemy = makeEnemy(r.floor);
  r.player.block = 0;
  r.log = [];
  pushLog(`${r.enemy.name}が現れた！`);
  startPlayerTurn(true);
  S.screen='battle';
  renderBattle();
}

function drawCards(n){
  const r = S.run;
  for(let i=0;i<n;i++){
    if(r.draw.length===0){
      if(r.discard.length===0) return;
      r.draw = shuffle(r.discard);
      r.discard = [];
      pushLog('捨札を山札に戻した。');
    }
    r.hand.push(r.draw.pop());
  }
}

function startPlayerTurn(first){
  const r = S.run;
  r.player.block = 0;
  const autoBlock = r.player.metallicize + r.player.permMetallicize;
  if(autoBlock>0){ r.player.block += autoBlock; }
  if(!first){
    // discard hand from previous turn, except cards flagged "retain"
    const keep = [];
    const toDiscard = [];
    r.hand.forEach(cid=>{
      const c = cardById(cid);
      if(c && c.retain) keep.push(cid); else toDiscard.push(cid);
    });
    r.discard.push(...toDiscard);
    r.hand = keep;
  }
  r.player.energy = S.settings.energyPerTurn + (r.player.extraEnergy||0);
  r.cardsPlayedThisTurn = 0;
  r.tagsPlayedThisTurn = [];
  if(r.activeTriggers) r.activeTriggers = r.activeTriggers.filter(t=>t.duration!=='turn');
  drawCards(S.settings.handSize + (r.player.extraDraw||0));
  r.turnPhase='player';
}

function applyDamageToEnemy(raw, pierce){
  const r = S.run; const e = r.enemy;
  let dmg = raw;
  if(r.player.weak>0) dmg = Math.floor(dmg*0.75);
  if(e.vulnerable>0) dmg = Math.floor(dmg*1.5);
  let blocked = 0;
  if(!pierce){ blocked = Math.min(e.block, dmg); e.block -= blocked; dmg -= blocked; }
  e.hp = Math.max(0, e.hp - dmg);
  return dmg+blocked;
}
function applyDamageToPlayer(raw){
  const r = S.run; const p = r.player;
  let dmg = raw;
  if(r.enemy.weak>0) dmg = Math.floor(dmg*0.75);
  if(p.vulnerable>0) dmg = Math.floor(dmg*1.5);
  const blocked = Math.min(p.block, dmg);
  p.block -= blocked; dmg -= blocked;
  p.hp = Math.max(0, p.hp - dmg);
  return dmg+blocked;
}

function playCard(handIdx){
  const r = S.run; if(r.turnPhase!=='player') return;
  const cardId = r.hand[handIdx];
  const c = cardById(cardId);
  if(!c || c.cost > r.player.energy) return;
  r.player.energy -= c.cost;

  resolveCardPlayCore(r, c, ()=>{
    // Remove by ID rather than the original handIdx: cardOp effects resolved above
    // (draw/discard/etc.) may have shifted hand indices.
    const finalIdx = r.hand.indexOf(cardId);
    if(finalIdx>=0) r.hand.splice(finalIdx,1);
    if(c.exhaust){ r.exhausted.push(cardId); }
    else{ r.discard.push(cardId); }

    if(r.enemy.hp<=0){ onEnemyDefeated(); return; }
    if(r.player.hp<=0){ onPlayerDefeated(); return; }
    renderBattle();
  });
}

function endPlayerTurn(){
  const r = S.run; if(r.turnPhase!=='player') return;
  // tick down player debuffs at end of player's turn
  if(r.player.weak>0) r.player.weak--;
  if(r.player.vulnerable>0) r.player.vulnerable--;
  r.turnPhase='enemy';
  renderBattle();
  setTimeout(runEnemyTurn, 550);
}

function runEnemyTurn(){
  const r = S.run; const e = r.enemy;
  if(r.ended) return;
  // poison at start of enemy turn
  if(e.poison>0){
    e.hp = Math.max(0, e.hp - e.poison);
    pushLog(`${e.name}は毒で${e.poison}ダメージ。`);
    e.poison--;
    if(e.hp<=0){ onEnemyDefeated(); return; }
  }
  const move = e.moves[e.moveIdx % e.moves.length];
  if(move.type==='attack'){
    const dealt = applyDamageToPlayer(move.damage + e.strength);
    pushLog(`${e.name}の攻撃！ ${dealt}ダメージ。`);
    const thornsTotal = r.player.thorns + r.player.permThorns;
    if(thornsTotal>0){
      e.hp = Math.max(0, e.hp - thornsTotal);
      pushLog(`棘によって${e.name}に${thornsTotal}ダメージ。`);
      if(e.hp<=0){ onEnemyDefeated(); return; }
    }
  } else if(move.type==='defend'){
    e.block += move.block;
    pushLog(`${e.name}は防御態勢。ブロック+${move.block}。`);
  } else if(move.type==='buff'){
    e.strength += move.strength;
    pushLog(`${e.name}は力を高めた！ 強化+${move.strength}。`);
  }
  if(e.weak>0) e.weak--;
  if(e.vulnerable>0) e.vulnerable--;
  e.moveIdx++;
  if(r.player.hp<=0){ onPlayerDefeated(); return; }
  startPlayerTurn(false);
  renderBattle();
}

function goldForFloor(floorIndex, elite, boss){
  let base = 15 + floorIndex*3;
  if(boss) base *= 2.2;
  else if(elite) base *= 1.6;
  return Math.round(base * (0.85 + Math.random()*0.3));
}

function onEnemyDefeated(){
  const r = S.run;
  purgeTemporaryCards(r);
  const gained = goldForFloor(r.floor, r.enemy.elite, r.enemy.boss);
  r.player.gold += gained;
  r.lastGoldGained = gained;
  pushLog(`${r.enemy.name}を撃破した！ ゴールド+${gained}。`);
  if(r.floor >= S.settings.floorCount){
    S.screen='victory'; renderVictory(); return;
  }
  if(r.enemy.elite || r.enemy.boss){
    const avail = S.relics.filter(rel=>!r.player.relics.includes(rel.id));
    if(avail.length>0){
      r.pendingRelic = avail[Math.floor(Math.random()*avail.length)];
      S.screen='relicReward';
      renderRelicReward();
      return;
    }
  }
  S.screen='reward';
  renderReward();
}
function onPlayerDefeated(){
  S.run.ended = true;
  S.screen='defeat';
  renderDefeat();
}

/* ============================= BATTLE RENDER ============================= */

function statusChips(entity){
  const chips = [];
  if(entity.strength) chips.push(`💪 強化 ${entity.strength}`);
  if(entity.weak) chips.push(`😮‍💨 弱体 ${entity.weak}`);
  if(entity.vulnerable) chips.push(`🎯 脆弱 ${entity.vulnerable}`);
  if(entity.poison) chips.push(`☠️ 毒 ${entity.poison}`);
  if(entity.metallicize) chips.push(`🛡️ 自動 ${entity.metallicize}`);
  if(entity.thorns) chips.push(`🌵 棘 ${entity.thorns}`);
  return chips.map(c=>`<span class="status-chip">${c}</span>`).join('');
}
function intentLabel(e){
  const move = e.moves[e.moveIdx % e.moves.length];
  if(move.type==='attack') return {cls:'atk', text:`⚔️ 攻撃予告：${move.damage + e.strength}`};
  if(move.type==='defend') return {cls:'def', text:`🛡️ 防御予告：${move.block}`};
  return {cls:'buf', text:`✨ 強化予告：+${move.strength}`};
}

function renderCardChoiceOverlay(r){
  const pc = r.pendingChoice;
  const selected = pc.selectedIdx;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">CHOICE</p>
    <h2>カードを選択（${selected.length} / ${pc.need}）</h2>
    <div class="reward-row" id="choice-row">
      ${pc.candidates.map((e,i)=>{
        const c = cardById(e.rawId);
        if(!c) return '';
        const picked = selected.includes(i);
        return `<div data-idx="${i}" style="text-align:center; cursor:pointer; ${picked?'outline:3px solid var(--gold); border-radius:10px;':''}">
          ${renderCardHTML(c,{})}
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:18px;">
      <button class="primary" id="btn-choice-confirm" ${selected.length!==pc.need?'disabled':''}>決定</button>
    </div>
  </div>`;
  qsa('#choice-row > div').forEach(wrap=>{
    wrap.onclick = ()=>{
      const i = parseInt(wrap.dataset.idx,10);
      const pos = selected.indexOf(i);
      if(pos>=0) selected.splice(pos,1);
      else if(selected.length < pc.need) selected.push(i);
      renderCardChoiceOverlay(r);
    };
  });
  qs('#btn-choice-confirm').onclick = ()=>{
    if(selected.length!==pc.need) return;
    const chosen = selected.map(i=>pc.candidates[i]);
    r.pendingChoice = null;
    pc.onConfirm(chosen);
  };
}

function renderBattle(){
  const r = S.run;
  if(r.pendingChoice){ renderCardChoiceOverlay(r); return; }
  const p = r.player; const e = r.enemy;
  const intent = intentLabel(e);
  app().innerHTML = `
  <div class="screen">
    <div class="floor-progress">階層 ${r.floor} / ${S.settings.floorCount} ${e.boss?'・ボス戦':(e.elite?'・エリート':'')} ・ 💰${p.gold}</div>
    ${p.relics.length? `<div style="text-align:center; font-size:11px; color:var(--gold); margin-bottom:8px;">🏺 ${p.relics.map(id=>{const rel=S.relics.find(x=>x.id===id); return rel?rel.name:id;}).join(' ・ ')}</div>` : ''}

      <div class="vsmark">VS</div>
      <div class="combatant enemy">
        <div class="portrait">${e.emoji}</div>
        <div class="cname">${e.name}</div>
        <div class="hpbar-wrap"><div class="hpbar-fill" style="width:${Math.max(0,100*e.hp/e.maxHp)}%"></div><div class="hpbar-text">${e.hp} / ${e.maxHp}${e.block?` (🛡${e.block})`:''}</div></div>
        <div class="statuses">${statusChips(e)}</div>
        <div class="intent ${intent.cls}">${intent.text}</div>
      </div>
    </div>

    <div class="hand-zone">
      <div class="battle-controls">
        <div class="pile-info">
          <span>山札 ${r.draw.length}</span><span>捨札 ${r.discard.length}</span>
        </div>
        <div class="energy-badge">${p.energy}</div>
        <button class="primary" id="btn-endturn" ${r.turnPhase!=='player'?'disabled':''}>${r.turnPhase==='player'?'ターン終了':'敵の行動中…'}</button>
      </div>
      <div class="hand-row" id="hand-row">
        ${r.hand.map((cid,idx)=>{
          const c = cardById(cid);
          const unplayable = (c.cost>p.energy || r.turnPhase!=='player');
          return `<div data-idx="${idx}">${renderCardHTML(c,{unplayable})}</div>`;
        }).join('')}
      </div>
      <div class="log-box">${r.log.map(l=>`<div>・${l}</div>`).join('')}</div>
    </div>
  </div>`;

  qsa('#hand-row > div').forEach(wrap=>{
    wrap.querySelector('.card').onclick = ()=>{
      if(r.turnPhase!=='player') return;
      playCard(parseInt(wrap.dataset.idx,10));
    };
  });
  qs('#btn-endturn').onclick = endPlayerTurn;
}

function ownedCardInstances(r){
  const list = [];
  r.draw.forEach((cid,i)=>list.push({cid,pile:'draw',i}));
  r.hand.forEach((cid,i)=>list.push({cid,pile:'hand',i}));
  r.discard.forEach((cid,i)=>list.push({cid,pile:'discard',i}));
  r.exhausted.forEach((cid,i)=>list.push({cid,pile:'exhausted',i}));
  return list;
}

/* ============================= RELICS ============================= */

const RELIC_EFFECT_DEFS = [
  {key:'permStrength', label:'強化+（永続）', desc:(v)=>`強化+${v}（永続）`},
  {key:'permMetallicize', label:'自動ブロック+（永続）', desc:(v)=>`自動ブロック+${v}（永続）`},
  {key:'permThorns', label:'棘+（永続）', desc:(v)=>`棘+${v}（永続）`},
  {key:'maxHpBonus', label:'最大HP+（入手時、即時回復も含む）', desc:(v)=>`最大HP+${v}`},
  {key:'goldBonus', label:'ゴールド+（入手時）', desc:(v)=>`ゴールド+${v}`},
  {key:'extraEnergy', label:'毎ターンのエネルギー+', desc:(v)=>`毎ターンのエネルギー+${v}`},
  {key:'extraDraw', label:'毎ターンのドロー+', desc:(v)=>`毎ターンのドロー+${v}`},
];

function relicDescription(relic){
  const e = relic.effect || {};
  const parts = [];
  RELIC_EFFECT_DEFS.forEach(def=>{
    const v = e[def.key]||0;
    if(v>0) parts.push(def.desc(v));
  });
  return parts.length ? parts.join('。')+'。' : '効果なし';
}

const DEFAULT_RELICS = [
  {id:'bloodstained_charm', name:'血染めの護符', rarity:'common', effect:{permStrength:1}},
  {id:'iron_heart', name:'鉄の心臓', rarity:'common', effect:{permMetallicize:1}},
  {id:'thorn_bracelet', name:'棘の腕輪', rarity:'uncommon', effect:{permThorns:2}},
  {id:'giant_heart', name:'巨人の心臓', rarity:'uncommon', effect:{maxHpBonus:15}},
  {id:'sage_scroll', name:'賢者の巻物', rarity:'rare', effect:{extraDraw:1}},
  {id:'sun_coin', name:'太陽のコイン', rarity:'rare', effect:{extraEnergy:1}},
];

function applyRelicEffect(r, relic){
  const e = relic.effect || {};
  if(e.permStrength) r.player.permStrength += e.permStrength;
  if(e.permMetallicize) r.player.permMetallicize += e.permMetallicize;
  if(e.permThorns) r.player.permThorns += e.permThorns;
  if(e.maxHpBonus){ r.player.maxHp += e.maxHpBonus; r.player.hp = Math.min(r.player.maxHp, r.player.hp + e.maxHpBonus); }
  if(e.goldBonus) r.player.gold += e.goldBonus;
  if(e.extraEnergy) r.player.extraEnergy = (r.player.extraEnergy||0) + e.extraEnergy;
  if(e.extraDraw) r.player.extraDraw = (r.player.extraDraw||0) + e.extraDraw;
  r.player.relics.push(relic.id);
}

function renderRelicReward(){
  const r = S.run;
  const rel = r.pendingRelic;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">RELIC</p>
    <h2>${rel.name}</h2>
    <p style="color:var(--parchment-dim); max-width:400px; margin:10px auto;">${relicDescription(rel)}</p>
    <div style="margin-top:24px; display:flex; gap:10px; justify-content:center;">
      <button class="primary" id="btn-relic-take">手に入れる</button>
      <button class="ghost" id="btn-relic-skip">見送る</button>

  qs('#btn-relic-skip').onclick = ()=>{ r.pendingRelic=null; S.screen='reward'; renderReward(); };
}

const EVENT_TEMPLATES = [
  {title:'朽ちた祭壇', desc:'古い祭壇の上に、赤黒い液体で満ちた小瓶が置かれている。', choices:[
    {label:'血を捧げて飲み干す（HP-10 / 強化+2 永続）', apply:(r)=>{ r.player.hp=Math.max(1,r.player.hp-10); r.player.permStrength+=2; return '力が全身に満ちるのを感じる。しかし体は重い。'; }},
    {label:'何も持たずに立ち去る', apply:()=>'祭壇に背を向け、静かに先へ進んだ。'},
  ]},
  {title:'旅の行商人', desc:'フードを被った商人が道の端に座り、珍しい品を並べている。', choices:[
    {label:'掘り出し物を買う（40ゴールド消費・アンコモン以上のカードを1枚入手）', cost:40, apply:(r)=>{
      r.player.gold -= 40;
      const pool = S.cards.filter(c=>(c.rarity==='uncommon'||c.rarity==='rare') && !c.generatedOnly);
      const pick = pool[Math.floor(Math.random()*pool.length)];
      if(pick) r.discard.push(pick.id);
      return pick? `${pick.name}を手に入れた。` : '今日はめぼしい品がなかったようだ。';
    }},
    {label:'素通りする（道に落ちていた10ゴールドを拾う）', apply:(r)=>{ r.player.gold+=10; return '足元に転がっていたコインを拾った。'; }},
  ]},
  {title:'呪われた宝箱', desc:'苔むした宝箱が不気味な光を放っている。', choices:[
    {label:'開ける（HP-6 / 60ゴールド獲得）', apply:(r)=>{ r.player.hp=Math.max(1,r.player.hp-6); r.player.gold+=60; return '罠が発動したが、中の財貨は本物だった。'; }},
    {label:'触れずに立ち去る', apply:()=>'嫌な予感がして、宝箱には触れなかった。'},
  ]},
  {title:'古の司書', desc:'ページの擦り切れた本を抱えた老人が、静かに問いかけてくる。', choices:[
    {label:'知識と引き換える（基本カードを1枚失い、強力なカードを1枚得る）', apply:(r)=>{
      const basics = ownedCardInstances(r).filter(x=>{ const c=cardById(x.cid); return c && c.rarity==='basic'; });
      let lostName = null;
      if(basics.length){
        const inst = basics[Math.floor(Math.random()*basics.length)];
        r[inst.pile].splice(inst.i,1);
        lostName = cardById(inst.cid).name;
      }
      const pool = S.cards.filter(c=>(c.rarity==='uncommon'||c.rarity==='rare') && !c.generatedOnly);
      const gained = pool[Math.floor(Math.random()*pool.length)];
      if(gained) r.discard.push(gained.id);
      return lostName? `${lostName}が消え、代わりに${gained?gained.name:'何か'}を授かった。` : `${gained?gained.name:'何か'}を授かった。`;
    }},
    {label:'関わらずに立ち去る', apply:()=>'老人は静かに微笑み、去っていった。'},
  ]},
  {title:'迷える巡礼者', desc:'傷ついた巡礼者が道端に座り込んでいる。', choices:[
    {label:'治療を手伝う（HP-5 / 自動ブロック+1 永続）', apply:(r)=>{ r.player.hp=Math.max(1,r.player.hp-5); r.player.permMetallicize+=1; return '巡礼者から加護の言葉を授かった。'; }},
    {label:'先を急ぐ（道中で15ゴールドを見つける）', apply:(r)=>{ r.player.gold+=15; return '先を急いだ道中、落し物のゴールドを見つけた。'; }},
  ]},
  {title:'巡回の鍛冶屋', desc:'寡黙な鍛冶屋が、道具一式を広げて座っている。', choices:[
    {label:'カードを1枚鍛え直してもらう（デッキからランダムに1枚を無料で強化）', apply:(r)=>{
      const eligible = ownedCardInstances(r).filter(x=>!isUpgradedInstanceId(x.cid));
      if(eligible.length===0) return '強化できるカードが見当たらなかった。';
      const inst = eligible[Math.floor(Math.random()*eligible.length)];
      const name = cardById(inst.cid).name;
      r[inst.pile][inst.i] = upgradeRawId(inst.cid);
      return `${name}が鍛え直され、${name}+になった。`;
    }},
    {label:'礼を言って立ち去る（15ゴールド獲得）', apply:(r)=>{ r.player.gold+=15; return '鍛冶屋から餞別を受け取った。'; }},
  ]},
];

function renderEvent(){
  const r = S.run;
  if(!r.currentEvent){ r.currentEvent = EVENT_TEMPLATES[Math.floor(Math.random()*EVENT_TEMPLATES.length)]; r.eventResult = null; }
  const ev = r.currentEvent;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">EVENT</p>
    <h2>${ev.title}</h2>
    <p style="color:var(--parchment-dim); max-width:440px; margin:10px auto;">${ev.desc}</p>
    <p style="font-size:13px; color:var(--gold);">所持ゴールド: ${r.player.gold}</p>
    ${r.eventResult ? `
      <p style="margin-top:20px; color:var(--parchment);">${r.eventResult}</p>
      <div style="margin-top:22px;"><button class="primary" id="btn-event-continue">先へ進む</button></div>
    ` : `
      <div style="display:flex; flex-direction:column; gap:10px; max-width:420px; margin:24px auto 0;">
        ${ev.choices.map((c,i)=>`<button class="ghost event-choice" data-idx="${i}" ${c.cost && r.player.gold<c.cost ? 'disabled':''}>${c.label}</button>`).join('')}
      </div>
    `}
  </div>`;
  if(!r.eventResult){
    qsa('.event-choice').forEach(btn=>{
      btn.onclick = ()=>{
        const choice = ev.choices[parseInt(btn.dataset.idx,10)];
        r.eventResult = choice.apply(r) || '何も起こらなかった。';
        renderEvent();
      };
    });
  } else {
    qs('#btn-event-continue').onclick = ()=>{
      r.currentEvent = null; r.eventResult = null;
      r.floor++; beginFloor();
    };
  }
}

function shopPrice(rarity){
  return rarity==='rare' ? 150 : (rarity==='uncommon' ? 85 : 50);
}

function renderShop(){
  const r = S.run;
  if(!r.shopOffers){
    const used = [];
    r.shopOffers = [];
    for(let i=0;i<3;i++){
      const c = weightedPickCard(used);
      if(!c) break;
      used.push(c.id);
      r.shopOffers.push({cardId:c.id, price:shopPrice(c.rarity), sold:false});
    }
    r.shopRemoveMode = false;
    r.shopUpgradeMode = false;
    const availRelics = S.relics.filter(rel=>!r.player.relics.includes(rel.id));
    r.shopRelic = availRelics.length ? {...availRelics[Math.floor(Math.random()*availRelics.length)], price:200, sold:false} : null;
  }
  const totalOwned = ownedCardInstances(r).length;
  const upgradeEligible = ownedCardInstances(r).filter(x=>!isUpgradedInstanceId(x.cid));
  const mode = r.shopRemoveMode ? 'remove' : (r.shopUpgradeMode ? 'upgrade' : 'main');

  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">MERCHANT</p>
    <h2>行商の露店</h2>
    <p style="font-size:13px; color:var(--gold); margin-top:6px;">所持ゴールド: ${r.player.gold}</p>
    ${mode==='main' ? `
      <div class="reward-row" id="shop-row">
        ${r.shopOffers.map((o,i)=>{
          const c = cardById(o.cardId);
          if(!c) return '';
          return `<div data-idx="${i}" style="text-align:center;">
            ${renderCardHTML(c,{unplayable:o.sold||r.player.gold<o.price})}
            <div style="margin-top:6px; font-size:13px; color:var(--gold);">${o.sold?'売り切れ':o.price+'G'}</div>
          </div>`;
        }).join('')}
      </div>
      ${r.shopRelic ? `
        <div style="margin-top:18px; max-width:220px; margin-left:auto; margin-right:auto; border:2px solid var(--gold); border-radius:8px; padding:12px; text-align:center; background:var(--bg-panel-raised);">
          <div style="font-family:var(--font-display); font-size:14px; color:var(--gold);">${r.shopRelic.name}</div>
          <div style="font-size:11px; color:var(--parchment-dim); margin:6px 0;">${relicDescription(r.shopRelic)}</div>
          <button id="btn-buy-relic" ${(r.shopRelic.sold||r.player.gold<r.shopRelic.price)?'disabled':''}>${r.shopRelic.sold?'売り切れ':r.shopRelic.price+'G で購入'}</button>
        </div>
      ` : ''}
      <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="btn-shop-remove" ${(r.player.gold<75 || totalOwned<=5)?'disabled':''}>カードを1枚除去する（75G）</button>
        <button id="btn-shop-upgrade" ${(r.player.gold<100 || upgradeEligible.length===0)?'disabled':''}>カードを1枚強化する（100G）</button>
        <button class="primary" id="btn-shop-leave">店を出る</button>
      </div>
    ` : mode==='remove' ? `
      <p style="color:var(--parchment-dim); margin-top:10px;">除去するカードを選んでください（75G）</p>
      <div class="reward-row" id="remove-row">
        ${ownedCardInstances(r).map((inst,i)=>`<div data-idx="${i}">${renderCardHTML(cardById(inst.cid),{mini:true})}</div>`).join('')}
      </div>
      <button class="ghost" id="btn-remove-cancel">やめる</button>
    ` : `
      <p style="color:var(--parchment-dim); margin-top:10px;">強化するカードを選んでください（100G）</p>
      <div class="reward-row" id="upgrade-row">
        ${upgradeEligible.map((inst,i)=>`<div data-idx="${i}">${renderCardHTML(cardById(inst.cid),{mini:true})}</div>`).join('')}
      </div>
      <button class="ghost" id="btn-upgrade-cancel">やめる</button>
    `}
  </div>`;

  if(mode==='main'){
    qsa('#shop-row > div').forEach(wrap=>{
      const cardEl = wrap.querySelector('.card');
      if(!cardEl) return;
      cardEl.onclick = ()=>{
        const idx = parseInt(wrap.dataset.idx,10);
        const offer = r.shopOffers[idx];
        if(offer.sold || r.player.gold<offer.price) return;
        r.player.gold -= offer.price;
        offer.sold = true;
        r.discard.push(offer.cardId);
        renderShop();
      };
    });
    if(r.shopRelic && qs('#btn-buy-relic')){
      qs('#btn-buy-relic').onclick = ()=>{
        if(r.shopRelic.sold || r.player.gold<r.shopRelic.price) return;
        r.player.gold -= r.shopRelic.price;
        applyRelicEffect(r, r.shopRelic);
        r.shopRelic.sold = true;
        renderShop();
      };
    }
    qs('#btn-shop-remove').onclick = ()=>{ r.shopRemoveMode = true; renderShop(); };
    qs('#btn-shop-upgrade').onclick = ()=>{ r.shopUpgradeMode = true; renderShop(); };
    qs('#btn-shop-leave').onclick = ()=>{ r.shopOffers=null; r.shopRelic=null; r.floor++; beginFloor(); };
  } else if(mode==='remove'){
    qsa('#remove-row > div').forEach(wrap=>{
      wrap.querySelector('.card').onclick = ()=>{
        const idx = parseInt(wrap.dataset.idx,10);
        const inst = ownedCardInstances(r)[idx];
        r[inst.pile].splice(inst.i,1);
        r.player.gold -= 75;
        r.shopRemoveMode = false;
        renderShop();
      };
    });
    qs('#btn-remove-cancel').onclick = ()=>{ r.shopRemoveMode=false; renderShop(); };
  } else {
    qsa('#upgrade-row > div').forEach(wrap=>{
      wrap.querySelector('.card').onclick = ()=>{
        const idx = parseInt(wrap.dataset.idx,10);
        const inst = upgradeEligible[idx];
        r[inst.pile][inst.i] = upgradeRawId(inst.cid);
        r.player.gold -= 100;
        r.shopUpgradeMode = false;
        renderShop();
      };
    });
    qs('#btn-upgrade-cancel').onclick = ()=>{ r.shopUpgradeMode=false; renderShop(); };
  }
}

/* ============================= BOOT ============================= */

async function boot(){
  app().innerHTML = `<div class="center-screen"><p class="eyebrow">LOADING</p><h2>書庫を開いている…</h2></div>`;
  S.cards = loadCards();
  if(!S.cards || S.cards.length===0) S.cards = DEFAULT_CARDS;
  S.relics = loadRelics();
  if(!S.relics || S.relics.length===0) S.relics = DEFAULT_RELICS;
  S.settings = loadSettings();
  S.screen='home';
  renderHome();
}
boot();

})();
